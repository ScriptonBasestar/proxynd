groups:
  - name: proxynd.alerts
    rules:
      # Service availability alerts
      - alert: ProxyNDDown
        expr: up{job="proxynd"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ProxyND service is down"
          description: "ProxyND service has been down for more than 1 minute"
      
      # Health monitoring alerts
      - alert: ProxyNDHealthCheckFailing
        expr: proxynd_health_status{component!="overall"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND health check failing"
          description: "ProxyND {{ $labels.component }} health check is failing for more than 2 minutes"
      
      - alert: ProxyNDOverallHealthCritical
        expr: proxynd_health_status{component="overall"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ProxyND overall health critical"
          description: "ProxyND overall health is critical - multiple components are failing"
      
      - alert: ProxyNDProxyHealthDown
        expr: proxynd_proxy_health_status == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND proxy health down"
          description: "ProxyND {{ $labels.proxy_type }} proxy health is down for more than 3 minutes"
      
      - alert: ProxyNDCacheHealthDegraded
        expr: proxynd_cache_health_status < 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND cache health degraded"
          description: "ProxyND cache health is degraded - hit rate: {{ $value | humanizePercentage }}"
      
      - alert: ProxyNDSecurityHealthWarning
        expr: proxynd_security_health_status < 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND security health warning"
          description: "ProxyND security health status is degraded"
      
      - alert: ProxyNDSystemHealthCritical
        expr: proxynd_system_health_status == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ProxyND system health critical"
          description: "ProxyND system health is critical - CPU: {{ $labels.cpu_usage }}%, Memory: {{ $labels.memory_usage }}%"

      - alert: ProxyNDHighLatency
        expr: histogram_quantile(0.95, rate(proxynd_http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND high latency"
          description: "ProxyND 95th percentile latency is {{ $value }}s"

      # Error rate alerts
      - alert: ProxyNDHighErrorRate
        expr: rate(proxynd_http_requests_total{status=~"5.."}[5m]) / rate(proxynd_http_requests_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND high error rate"
          description: "ProxyND error rate is {{ $value | humanizePercentage }} for more than 5 minutes"

      - alert: ProxyNDCriticalErrorRate
        expr: rate(proxynd_http_requests_total{status=~"5.."}[5m]) / rate(proxynd_http_requests_total[5m]) > 0.25
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ProxyND critical error rate"
          description: "ProxyND error rate is {{ $value | humanizePercentage }} for more than 2 minutes"
      
      # User activity alerts
      - alert: ProxyNDHighUserErrorRate
        expr: rate(proxynd_user_errors_total[5m]) > 0.1
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND high user error rate"
          description: "ProxyND user error rate is {{ $value }} errors/second for {{ $labels.proxy_type }}"
      
      - alert: ProxyNDUnusualUserActivity
        expr: proxynd_active_users_total > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND unusual user activity"
          description: "ProxyND has {{ $value }} active users, which is unusually high"
      
      - alert: ProxyNDLongUserSessions
        expr: histogram_quantile(0.95, rate(proxynd_user_session_duration_seconds_bucket[5m])) > 86400
        for: 15m
        labels:
          severity: info
        annotations:
          summary: "ProxyND long user sessions detected"
          description: "ProxyND 95th percentile user session duration is {{ $value }}s (over 24 hours)"
      
      - alert: ProxyNDHighBandwidthUsage
        expr: rate(proxynd_user_bandwidth_bytes_total[5m]) > 1073741824
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND high bandwidth usage"
          description: "ProxyND bandwidth usage is {{ $value | humanizeBytes }}/second for {{ $labels.proxy_type }}"
      
      - alert: ProxyNDGeolocationAnomalies
        expr: increase(proxynd_user_geolocation_total{country="unknown"}[1h]) > 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND geolocation anomalies detected"
          description: "ProxyND detected {{ $value }} requests from unknown locations in the last hour"

      # Cache performance alerts
      - alert: ProxyNDLowCacheHitRate
        expr: rate(proxynd_cache_hits_total[5m]) / (rate(proxynd_cache_hits_total[5m]) + rate(proxynd_cache_misses_total[5m])) < 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND low cache hit rate"
          description: "ProxyND cache hit rate is {{ $value | humanizePercentage }} for more than 10 minutes"

      - alert: ProxyNDCacheStorageHigh
        expr: proxynd_cache_size_bytes / proxynd_cache_max_size_bytes > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND cache storage usage high"
          description: "ProxyND cache storage usage is {{ $value | humanizePercentage }}"

      # Resource utilization alerts
      - alert: ProxyNDHighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{container="proxynd"}[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND high CPU usage"
          description: "ProxyND CPU usage is {{ $value | humanizePercentage }}"

      - alert: ProxyNDHighMemoryUsage
        expr: container_memory_usage_bytes{container="proxynd"} / container_spec_memory_limit_bytes{container="proxynd"} > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND high memory usage"
          description: "ProxyND memory usage is {{ $value | humanizePercentage }}"

      # Security alerts
      - alert: ProxyNDHighFailedAuthRate
        expr: rate(proxynd_auth_failures_total[5m]) > 0.1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND high authentication failure rate"
          description: "ProxyND authentication failure rate is {{ $value }} failures/second"

      - alert: ProxyNDUnauthorizedAccess
        expr: rate(proxynd_unauthorized_attempts_total[5m]) > 0.05
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "ProxyND unauthorized access attempts"
          description: "ProxyND is experiencing {{ $value }} unauthorized access attempts/second"

      # Business logic alerts
      - alert: ProxyNDHighDownloadFailureRate
        expr: rate(proxynd_download_failures_total[5m]) / rate(proxynd_download_attempts_total[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND high download failure rate"
          description: "ProxyND download failure rate is {{ $value | humanizePercentage }}"

      - alert: ProxyNDUpstreamUnavailable
        expr: proxynd_upstream_available == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ProxyND upstream unavailable"
          description: "ProxyND upstream {{ $labels.upstream }} is unavailable"

      # Storage alerts
      - alert: ProxyNDLowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/storage"} / node_filesystem_size_bytes{mountpoint="/storage"}) < 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "ProxyND low disk space"
          description: "ProxyND storage disk space is below 10%"

      - alert: ProxyNDDiskSpaceWarning
        expr: (node_filesystem_avail_bytes{mountpoint="/storage"} / node_filesystem_size_bytes{mountpoint="/storage"}) < 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND disk space warning"
          description: "ProxyND storage disk space is below 20%"

      # Network alerts
      - alert: ProxyNDHighNetworkLatency
        expr: probe_duration_seconds{job="blackbox"} > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND high network latency"
          description: "ProxyND network latency is {{ $value }}s for {{ $labels.instance }}"

      - alert: ProxyNDEndpointDown
        expr: probe_success{job="blackbox"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ProxyND endpoint down"
          description: "ProxyND endpoint {{ $labels.instance }} is down"

  - name: proxynd.recording
    rules:
      # Request rate recording rules
      - record: proxynd:http_requests:rate5m
        expr: rate(proxynd_http_requests_total[5m])

      - record: proxynd:http_requests:rate1h
        expr: rate(proxynd_http_requests_total[1h])

      # Error rate recording rules
      - record: proxynd:http_errors:rate5m
        expr: rate(proxynd_http_requests_total{status=~"5.."}[5m])

      - record: proxynd:http_error_rate:rate5m
        expr: proxynd:http_errors:rate5m / proxynd:http_requests:rate5m

      # Cache performance recording rules
      - record: proxynd:cache_hit_rate:rate5m
        expr: rate(proxynd_cache_hits_total[5m]) / (rate(proxynd_cache_hits_total[5m]) + rate(proxynd_cache_misses_total[5m]))

      - record: proxynd:cache_usage:current
        expr: proxynd_cache_size_bytes / proxynd_cache_max_size_bytes

      # Resource utilization recording rules
      - record: proxynd:cpu_usage:rate5m
        expr: rate(container_cpu_usage_seconds_total{container="proxynd"}[5m])

      - record: proxynd:memory_usage:current
        expr: container_memory_usage_bytes{container="proxynd"} / container_spec_memory_limit_bytes{container="proxynd"}

      # Network performance recording rules
      - record: proxynd:network_latency:quantile95
        expr: histogram_quantile(0.95, rate(proxynd_http_request_duration_seconds_bucket[5m]))

      - record: proxynd:network_latency:quantile99
        expr: histogram_quantile(0.99, rate(proxynd_http_request_duration_seconds_bucket[5m]))
      
      # Health monitoring recording rules
      - record: proxynd:health_score:overall
        expr: avg(proxynd_health_status{component!="overall"})
      
      - record: proxynd:health_failures:rate5m
        expr: rate(proxynd_health_check_failures_total[5m])
      
      - record: proxynd:health_duration:quantile95
        expr: histogram_quantile(0.95, rate(proxynd_health_check_duration_seconds_bucket[5m]))
      
      # User activity recording rules
      - record: proxynd:user_requests:rate5m
        expr: rate(proxynd_user_requests_total[5m])
      
      - record: proxynd:user_requests:rate1h
        expr: rate(proxynd_user_requests_total[1h])
      
      - record: proxynd:user_bandwidth:rate5m
        expr: rate(proxynd_user_bandwidth_bytes_total[5m])
      
      - record: proxynd:user_errors:rate5m
        expr: rate(proxynd_user_errors_total[5m])
      
      - record: proxynd:user_session_duration:quantile95
        expr: histogram_quantile(0.95, rate(proxynd_user_session_duration_seconds_bucket[5m]))
      
      - record: proxynd:user_session_duration:quantile99
        expr: histogram_quantile(0.99, rate(proxynd_user_session_duration_seconds_bucket[5m]))
      
      - record: proxynd:daily_active_users:current
        expr: proxynd_unique_users_daily
      
      # Proxy type usage recording rules
      - record: proxynd:proxy_requests:rate5m_by_type
        expr: sum by (proxy_type) (rate(proxynd_user_requests_total[5m]))
      
      - record: proxynd:proxy_bandwidth:rate5m_by_type
        expr: sum by (proxy_type) (rate(proxynd_user_bandwidth_bytes_total[5m]))
      
      - record: proxynd:proxy_errors:rate5m_by_type
        expr: sum by (proxy_type) (rate(proxynd_user_errors_total[5m]))
      
      # Geographic distribution recording rules
      - record: proxynd:geo_requests:rate5m_by_country
        expr: sum by (country) (rate(proxynd_user_geolocation_total[5m]))
      
      - record: proxynd:geo_distribution:percentage
        expr: rate(proxynd_user_geolocation_total[5m]) / ignoring(country) group_left sum(rate(proxynd_user_geolocation_total[5m]))

  - name: proxynd.health.alerts
    rules:
      # Advanced health monitoring alerts
      - alert: ProxyNDHealthCheckLatency
        expr: histogram_quantile(0.95, rate(proxynd_health_check_duration_seconds_bucket[5m])) > 5
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND health check latency high"
          description: "ProxyND {{ $labels.component }} health check 95th percentile latency is {{ $value }}s"
      
      - alert: ProxyNDHealthCheckFailures
        expr: rate(proxynd_health_check_failures_total[5m]) > 0.01
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND health check failures"
          description: "ProxyND {{ $labels.component }} health check failure rate is {{ $value }} failures/second"
      
      - alert: ProxyNDMultipleHealthFailures
        expr: count(proxynd_health_status{component!="overall"} == 0) >= 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "ProxyND multiple health failures"
          description: "ProxyND has {{ $value }} failing health checks simultaneously"
      
      - alert: ProxyNDHealthTrendDegrading
        expr: proxynd:health_score:overall < 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "ProxyND health trend degrading"
          description: "ProxyND overall health score is {{ $value | humanizePercentage }} and degrading"
