# 🔄 ProxyND CI/CD Pipeline
name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 🧪 테스트 & 린트
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          go mod verify

      - name: Go vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m

      - name: Format check
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "❌ Code is not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Unit tests
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.out

  # 🔒 보안 스캔
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Gosec
        uses: securecodewarrior/github-action-gosec@master
        with:
          args: '-fmt sarif -out gosec.sarif ./...'

      - name: Upload Gosec results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # 🏗️ 빌드
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test, security]
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 🚀 통합 테스트 매트릭스
  integration:
    name: Integration Test (${{ matrix.proxy-type }})
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        proxy-type: [maven, npm, apt, docker, pip, yum, apk]
      fail-fast: false
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup test environment
        run: |
          mkdir -p tmp/config tmp/storage
          cp -r examples/proxy-types/*.yaml tmp/config/ 2>/dev/null || echo "No example configs found"
          cp -r sample-conf/* tmp/config/ 2>/dev/null || echo "No sample config found"

      - name: Cache upstream fixtures
        uses: actions/cache@v4
        with:
          path: tests/e2e/upstream-data
          key: upstream-fixtures-${{ matrix.proxy-type }}-${{ hashFiles('tests/e2e/upstream-data/**') }}
          restore-keys: |
            upstream-fixtures-${{ matrix.proxy-type }}-

      - name: Run integration tests for ${{ matrix.proxy-type }}
        run: |
          export CONFIG_DIR=./tmp/config
          export STORAGE_DIR=./tmp/storage
          export REDIS_URL=redis://localhost:6379
          export PROXY_TYPE=${{ matrix.proxy-type }}

          # Run specific integration tests for the proxy type
          go test -tags=integration -v ./tests/integration/${{ matrix.proxy-type }}_integration_test.go || \
          go test -tags=integration -v ./tests/integration/integration_test.go -run "Test.*${{ matrix.proxy-type | title }}" || \
          echo "No integration tests found for ${{ matrix.proxy-type }}"

      - name: Collect integration test logs
        if: always()
        run: |
          mkdir -p test-results/${{ matrix.proxy-type }}
          cp -r logs/* test-results/${{ matrix.proxy-type }}/ 2>/dev/null || echo "No logs to collect"
          ls -la test-results/${{ matrix.proxy-type }}/ || echo "No test results"

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results-${{ matrix.proxy-type }}
          path: test-results/${{ matrix.proxy-type }}/
          retention-days: 7

  # 🧪 E2E 테스트 매트릭스
  e2e:
    name: E2E Test (${{ matrix.proxy-type }})
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        proxy-type: [maven, npm, apt, docker, pip, yum, apk]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup test environment
        run: |
          mkdir -p tmp/config tmp/storage
          cp -r examples/proxy-types/*.yaml tmp/config/ 2>/dev/null || echo "No example configs found"

      - name: Cache upstream fixtures
        uses: actions/cache@v4
        with:
          path: tests/e2e/upstream-data
          key: e2e-fixtures-${{ matrix.proxy-type }}-${{ hashFiles('tests/e2e/upstream-data/**') }}
          restore-keys: |
            e2e-fixtures-${{ matrix.proxy-type }}-

      - name: Start ProxyND container
        run: |
          export CONFIG_DIR=./tmp/config
          export STORAGE_DIR=./tmp/storage
          export SERVER_PORT=8080
          docker-compose -f docker-compose.e2e.yml up -d proxynd

      - name: Wait for ProxyND to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8080/healthz; do sleep 2; done'

      - name: Run E2E tests for ${{ matrix.proxy-type }}
        run: |
          export PROXY_TYPE=${{ matrix.proxy-type }}
          if [ -f "tests/e2e/scripts/test-${{ matrix.proxy-type }}.sh" ]; then
            chmod +x tests/e2e/scripts/test-${{ matrix.proxy-type }}.sh
            tests/e2e/scripts/test-${{ matrix.proxy-type }}.sh
          else
            echo "No E2E script found for ${{ matrix.proxy-type }}"
            exit 0
          fi

      - name: Collect E2E logs
        if: always()
        run: |
          mkdir -p e2e-results/${{ matrix.proxy-type }}
          docker-compose -f docker-compose.e2e.yml logs proxynd > e2e-results/${{ matrix.proxy-type }}/proxynd.log
          cp -r tmp/storage/* e2e-results/${{ matrix.proxy-type }}/ 2>/dev/null || echo "No storage to collect"

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.proxy-type }}
          path: e2e-results/${{ matrix.proxy-type }}/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.e2e.yml down -v

  # 🎯 배포 (develop → staging)
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [build, integration, e2e]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.proxynd.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging..."
          # kubectl apply -f k8s/staging/ 또는 helm 명령어
          echo "✅ Staging deployment completed"

      - name: Smoke test
        run: |
          echo "🧪 Running smoke tests..."
          # curl -f https://staging.proxynd.example.com/health
          echo "✅ Smoke tests passed"

  # 📊 결과 요약
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [test, security, build, integration, e2e, deploy-staging]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 CI/CD Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test & Lint | ${{ needs.test.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Matrix | ${{ needs.integration.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Matrix | ${{ needs.e2e.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Staging | ${{ needs.deploy-staging.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.test.result }}" == "success" && "${{ needs.security.result }}" == "success" && "${{ needs.build.result }}" == "success" && "${{ needs.integration.result }}" == "success" && "${{ needs.e2e.result }}" == "success" ]]; then
            echo "✅ **All checks passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some checks failed**" >> $GITHUB_STEP_SUMMARY
          fi
