# 🔄 ProxyND CI/CD Pipeline
# Branch Strategy:
# - PR: Quick feedback (lint, format, unit, basic security, compile check)
# - Develop: Selective integration tests + basic security
# - Master: Full test suite + enhanced security + build verification
name: CI/CD

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'

env:
  GO_VERSION: '1.24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 🔍 변경 파일 감지 (Step 2-2: 선택적 테스트 실행)
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.filter.outputs.npm }}
      maven: ${{ steps.filter.outputs.maven }}
      docker: ${{ steps.filter.outputs.docker }}
      apt: ${{ steps.filter.outputs.apt }}
      pip: ${{ steps.filter.outputs.pip }}
      yum: ${{ steps.filter.outputs.yum }}
      apk: ${{ steps.filter.outputs.apk }}
      core: ${{ steps.filter.outputs.core }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            npm:
              - 'internal/services/npm/**'
              - 'handlers/proxy/npm_handler.go'
              - 'tests/integration/npm_*'
              - 'internal/adapters/http/npm_handler_adapter.go'
            maven:
              - 'internal/services/maven/**'
              - 'handlers/proxy/maven_handler.go'
              - 'tests/integration/maven_*'
            docker:
              - 'internal/services/docker/**'
              - 'handlers/proxy/docker_handler.go'
              - 'tests/integration/docker_*'
            apt:
              - 'internal/services/apt/**'
              - 'handlers/proxy/apt_handler.go'
              - 'tests/integration/apt_*'
            pip:
              - 'internal/services/pip/**'
              - 'handlers/proxy/pip_handler.go'
              - 'tests/integration/pip_*'
            yum:
              - 'internal/services/yum/**'
              - 'handlers/proxy/yum_handler.go'
              - 'tests/integration/yum_*'
            apk:
              - 'internal/services/apk/**'
              - 'handlers/proxy/apk_handler.go'
              - 'tests/integration/apk_*'
            core:
              - 'internal/app/**'
              - 'internal/config/**'
              - 'cache/**'
              - 'metrics/**'
              - 'main.go'

  # 🚀 빠른 피드백용 핵심 테스트 (Step 1-1: 계층화된 테스트 매트릭스)
  quick-tests:
    name: Quick Tests (${{ matrix.test-type }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        test-type: [unit, lint, format]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          go mod verify

      # 조건부 실행: 테스트 타입별로 분리 (Step 1-1: 계층화된 테스트 매트릭스)
      - name: Go vet (unit tests only)
        if: matrix.test-type == 'unit'
        run: go vet ./...

      - name: Lint
        if: matrix.test-type == 'lint'
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

      - name: Format check
        if: matrix.test-type == 'format'
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "❌ Code is not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Unit tests
        if: matrix.test-type == 'unit'
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        if: matrix.test-type == 'unit'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out

  # 🔒 보안 스캔
  security-basic:
    name: Security Scan (Basic)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Gosec Security Scanner (Basic)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt json -out gosec-report.json ./... || true
        continue-on-error: true

      - name: Vulnerability check (Basic)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  security-enhanced:
    name: Security Scan (Enhanced)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.ref == 'refs/heads/master'
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Gosec Security Scanner (Full)
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -fmt json -out gosec-report.json ./... || true
          gosec -fmt sarif -out gosec.sarif ./... || true
        continue-on-error: true

      - name: Upload Gosec SARIF results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        continue-on-error: true
        with:
          sarif_file: gosec.sarif

      - name: Vulnerability check (Full)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
        continue-on-error: true

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
        continue-on-error: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true

  # 🏗️ 빌드 검증 (PR, Develop)
  build-verify:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: [quick-tests, security-basic]
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binaries (verification only)
        run: |
          echo "🏗️ Building binaries for verification..."
          go build -v -o proxynd main.go
          ls -lh proxynd
          echo "✅ Binary build successful"

  # 🏗️ 빌드 + Docker 테스트 (Master only)
  build-test:
    name: Build and Docker Test
    runs-on: ubuntu-latest
    needs: [quick-tests, security-enhanced]
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build binaries (test)
        run: |
          echo "🏗️ Building binaries..."
          go build -v -o proxynd main.go
          ls -lh proxynd

      - name: Build Docker image (test only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.multiarch
          platforms: linux/amd64
          push: false
          tags: proxynd:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Docker smoke test
        run: |
          echo "🧪 Running Docker smoke test..."
          docker run -d --name proxynd-test -p 8080:8080 proxynd:test
          sleep 10
          curl -f http://localhost:8080/health || exit 1
          docker stop proxynd-test
          docker rm proxynd-test
          echo "✅ Docker smoke test passed"

  # 🧪 선택적 통합 테스트 (Develop)
  integration-selective:
    name: Integration Test (Selective - ${{ matrix.proxy-type }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, quick-tests, security-basic]
    if: |
      github.ref == 'refs/heads/develop' &&
      (needs.changes.outputs.core == 'true' ||
       needs.changes.outputs.npm == 'true' ||
       needs.changes.outputs.maven == 'true' ||
       needs.changes.outputs.docker == 'true')
    strategy:
      matrix:
        proxy-type: [maven, npm, docker]  # 핵심 프록시만
      fail-fast: false
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup test environment
        run: |
          mkdir -p tmp/config tmp/storage
          cp -r examples/proxy-types/*.yaml tmp/config/ 2>/dev/null || echo "No example configs"

      - name: Run integration tests for ${{ matrix.proxy-type }}
        run: |
          export CONFIG_DIR=./tmp/config
          export STORAGE_DIR=./tmp/storage
          export REDIS_URL=redis://localhost:6379
          export PROXY_TYPE=${{ matrix.proxy-type }}

          go test -tags=integration -v ./tests/integration/${{ matrix.proxy-type }}_* || echo "No tests found"

  # 🧪 전체 통합 테스트 매트릭스 (Master)
  integration-full:
    name: Integration Test (Full - ${{ matrix.proxy-type }}, Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [changes, quick-tests, security-enhanced]
    if: github.ref == 'refs/heads/master'
    strategy:
      matrix:
        proxy-type: [maven, npm, apt, docker, pip, yum, apk]
        go-version: ['1.23', '1.24']
        exclude:
          # 낮은 우선순위 프록시는 최신 Go 버전만 테스트
          - proxy-type: apk
            go-version: '1.23'
          - proxy-type: yum
            go-version: '1.23'
      fail-fast: false
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Setup test environment
        run: |
          mkdir -p tmp/config tmp/storage
          cp -r examples/proxy-types/*.yaml tmp/config/ 2>/dev/null || echo "No example configs found"
          cp -r sample-conf/* tmp/config/ 2>/dev/null || echo "No sample config found"

      # Step 3: 캐시 최적화 - 통합 테스트용 향상된 캐시
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
            ${{ runner.os }}-go-

      - name: Cache upstream fixtures
        uses: actions/cache@v4
        with:
          path: tests/e2e/upstream-data
          key: upstream-fixtures-${{ matrix.proxy-type }}-v2-${{ hashFiles('tests/e2e/upstream-data/**') }}
          restore-keys: |
            upstream-fixtures-${{ matrix.proxy-type }}-v2-
            upstream-fixtures-${{ matrix.proxy-type }}-

      - name: Run integration tests for ${{ matrix.proxy-type }}
        run: |
          export CONFIG_DIR=./tmp/config
          export STORAGE_DIR=./tmp/storage
          export REDIS_URL=redis://localhost:6379
          export PROXY_TYPE=${{ matrix.proxy-type }}

          # Run specific integration tests for the proxy type
          go test -tags=integration -v ./tests/integration/${{ matrix.proxy-type }}_integration_test.go || \
          go test -tags=integration -v ./tests/integration/integration_test.go -run "Test.*" || \
          echo "No integration tests found for ${{ matrix.proxy-type }}"

      # Step 4: 테스트 결과 수집 자동화
      - name: Collect integration test logs and coverage
        if: always()
        run: |
          mkdir -p test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}

          # 로그 수집
          cp -r logs/* test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}/ 2>/dev/null || echo "No logs to collect"

          # 커버리지 리포트 생성
          if [ -f coverage.out ]; then
            go tool cover -html=coverage.out -o test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}/coverage.html
            go tool cover -func=coverage.out > test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}/coverage.txt
          fi

          # 실패 시 디버깅 정보 수집
          if [ $? -ne 0 ]; then
            echo "Test failed, collecting debug info..."
            go version > test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}/debug-info.txt
            env | grep -E "(CONFIG|STORAGE|REDIS)" >> test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}/debug-info.txt
            ps aux | grep -E "(proxynd|redis)" >> test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}/debug-info.txt
          fi

          ls -la test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}/ || echo "No test results"

      - name: Upload integration test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: integration-results-${{ matrix.proxy-type }}-go${{ matrix.go-version }}
          path: test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}/
          retention-days: 7

  # 🌐 E2E 테스트 (Master only)
  e2e:
    name: E2E Test (${{ matrix.proxy-type }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    needs: integration-full
    if: github.ref == 'refs/heads/master'
    strategy:
      matrix:
        proxy-type: [maven, npm, docker]  # 핵심 타입만 E2E 테스트
        os: [ubuntu-latest, macos-latest]
        include:
          # 우선순위 기반 매트릭스 확장
          - proxy-type: npm
            priority: high
            timeout: 10
          - proxy-type: maven
            priority: high
            timeout: 15
          - proxy-type: docker
            priority: medium
            timeout: 20
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup test environment
        run: |
          mkdir -p tmp/config tmp/storage
          cp -r examples/proxy-types/*.yaml tmp/config/ 2>/dev/null || echo "No example configs found"

      - name: Cache upstream fixtures
        uses: actions/cache@v4
        with:
          path: tests/e2e/upstream-data
          key: e2e-fixtures-${{ matrix.proxy-type }}-${{ hashFiles('tests/e2e/upstream-data/**') }}
          restore-keys: |
            e2e-fixtures-${{ matrix.proxy-type }}-

      - name: Start ProxyND container
        run: |
          export CONFIG_DIR=./tmp/config
          export STORAGE_DIR=./tmp/storage
          export SERVER_PORT=8080
          docker-compose -f docker-compose.e2e.yml up -d proxynd

      - name: Wait for ProxyND to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8080/healthz; do sleep 2; done'

      - name: Run E2E tests for ${{ matrix.proxy-type }}
        run: |
          export PROXY_TYPE=${{ matrix.proxy-type }}
          if [ -f "tests/e2e/scripts/test-${{ matrix.proxy-type }}.sh" ]; then
            chmod +x tests/e2e/scripts/test-${{ matrix.proxy-type }}.sh
            tests/e2e/scripts/test-${{ matrix.proxy-type }}.sh
          else
            echo "No E2E script found for ${{ matrix.proxy-type }}"
            exit 0
          fi

      - name: Collect E2E logs
        if: always()
        run: |
          mkdir -p e2e-results/${{ matrix.proxy-type }}
          docker-compose -f docker-compose.e2e.yml logs proxynd > e2e-results/${{ matrix.proxy-type }}/proxynd.log
          cp -r tmp/storage/* e2e-results/${{ matrix.proxy-type }}/ 2>/dev/null || echo "No storage to collect"

      - name: Upload E2E test results
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-results-${{ matrix.proxy-type }}
          path: e2e-results/${{ matrix.proxy-type }}/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.e2e.yml down -v

  # Note: Deployment removed from CI pipeline
  # Actual deployment happens only on GitHub Release via release.yml

  # 📊 결과 요약
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [quick-tests, security-basic, security-enhanced, build-verify, build-test, integration-selective, integration-full, e2e]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 CI/CD Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Event:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quick Tests | ${{ needs.quick-tests.result }} |" >> $GITHUB_STEP_SUMMARY

          # Security (conditional)
          if [ "${{ needs.security-basic.result }}" != "" ]; then
            echo "| Security (Basic) | ${{ needs.security-basic.result }} |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.security-enhanced.result }}" != "" ]; then
            echo "| Security (Enhanced) | ${{ needs.security-enhanced.result }} |" >> $GITHUB_STEP_SUMMARY
          fi

          # Build (conditional)
          if [ "${{ needs.build-verify.result }}" != "" ]; then
            echo "| Build Verify | ${{ needs.build-verify.result }} |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.build-test.result }}" != "" ]; then
            echo "| Build Test | ${{ needs.build-test.result }} |" >> $GITHUB_STEP_SUMMARY
          fi

          # Integration (conditional)
          if [ "${{ needs.integration-selective.result }}" != "" ]; then
            echo "| Integration (Selective) | ${{ needs.integration-selective.result }} |" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${{ needs.integration-full.result }}" != "" ]; then
            echo "| Integration (Full) | ${{ needs.integration-full.result }} |" >> $GITHUB_STEP_SUMMARY
          fi

          # E2E (conditional)
          if [ "${{ needs.e2e.result }}" != "" ]; then
            echo "| E2E Tests | ${{ needs.e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Branch-specific summary
          if [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "### Master Branch - Full Test Suite" >> $GITHUB_STEP_SUMMARY
            echo "✅ Enhanced security scan" >> $GITHUB_STEP_SUMMARY
            echo "✅ Full integration matrix" >> $GITHUB_STEP_SUMMARY
            echo "✅ E2E tests" >> $GITHUB_STEP_SUMMARY
            echo "✅ Docker build verification" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ github.ref }}" = "refs/heads/develop" ]; then
            echo "### Develop Branch - Fast Feedback" >> $GITHUB_STEP_SUMMARY
            echo "✅ Basic security scan" >> $GITHUB_STEP_SUMMARY
            echo "✅ Selective integration tests" >> $GITHUB_STEP_SUMMARY
            echo "✅ Build verification" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Pull Request - Quick Validation" >> $GITHUB_STEP_SUMMARY
            echo "✅ Lint and format checks" >> $GITHUB_STEP_SUMMARY
            echo "✅ Unit tests" >> $GITHUB_STEP_SUMMARY
            echo "✅ Basic security scan" >> $GITHUB_STEP_SUMMARY
            echo "✅ Compile verification" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "📦 **Note:** Binaries and Docker images are only built on GitHub Release" >> $GITHUB_STEP_SUMMARY
