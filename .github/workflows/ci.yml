# 🔄 ProxyND CI/CD Pipeline
name: CI/CD

# Step 2: 조건부 실행 로직 - PR과 브랜치별 차별화
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/**'
      - 'Dockerfile*'
      - 'docker-compose*.yml'

env:
  GO_VERSION: '1.23'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 🔍 변경 파일 감지 (Step 2-2: 선택적 테스트 실행)
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      npm: ${{ steps.filter.outputs.npm }}
      maven: ${{ steps.filter.outputs.maven }}
      docker: ${{ steps.filter.outputs.docker }}
      apt: ${{ steps.filter.outputs.apt }}
      pip: ${{ steps.filter.outputs.pip }}
      yum: ${{ steps.filter.outputs.yum }}
      apk: ${{ steps.filter.outputs.apk }}
      core: ${{ steps.filter.outputs.core }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check changed files
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            npm:
              - 'internal/services/npm/**'
              - 'handlers/proxy/npm_handler.go'
              - 'tests/integration/npm_*'
              - 'internal/adapters/http/npm_handler_adapter.go'
            maven:
              - 'internal/services/maven/**'
              - 'handlers/proxy/maven_handler.go'
              - 'tests/integration/maven_*'
            docker:
              - 'internal/services/docker/**'
              - 'handlers/proxy/docker_handler.go'
              - 'tests/integration/docker_*'
            apt:
              - 'internal/services/apt/**'
              - 'handlers/proxy/apt_handler.go'
              - 'tests/integration/apt_*'
            pip:
              - 'internal/services/pip/**'
              - 'handlers/proxy/pip_handler.go'
              - 'tests/integration/pip_*'
            yum:
              - 'internal/services/yum/**'
              - 'handlers/proxy/yum_handler.go'
              - 'tests/integration/yum_*'
            apk:
              - 'internal/services/apk/**'
              - 'handlers/proxy/apk_handler.go'
              - 'tests/integration/apk_*'
            core:
              - 'internal/app/**'
              - 'internal/config/**'
              - 'cache/**'
              - 'metrics/**'
              - 'main.go'

  # 🚀 빠른 피드백용 핵심 테스트 (Step 1-1: 계층화된 테스트 매트릭스)
  quick-tests:
    name: Quick Tests (${{ matrix.test-type }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        test-type: [unit, lint, format]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          go mod verify

      # 조건부 실행: 테스트 타입별로 분리 (Step 1-1: 계층화된 테스트 매트릭스)
      - name: Go vet (unit tests only)
        if: matrix.test-type == 'unit'
        run: go vet ./...

      - name: Lint
        if: matrix.test-type == 'lint'
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m

      - name: Format check
        if: matrix.test-type == 'format'
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "❌ Code is not formatted:"
            gofmt -s -l .
            exit 1
          fi

      - name: Unit tests
        if: matrix.test-type == 'unit'
        run: |
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        if: matrix.test-type == 'unit'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.out

  # 🔒 보안 스캔
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Gosec
        uses: securecodewarrior/github-action-gosec@master
        with:
          args: '-fmt sarif -out gosec.sarif ./...'

      - name: Upload Gosec results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif

      - name: Vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # 🏗️ 빌드
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [quick-tests, security]
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 🧪 프록시별 통합 테스트 매트릭스 (Step 1-2: 계층화된 테스트 매트릭스)
  integration:
    name: Integration Test (${{ matrix.proxy-type }}, Go ${{ matrix.go-version }})
    runs-on: ubuntu-latest
    needs: [changes, quick-tests, security]
    if: |
      github.ref == 'refs/heads/develop' ||
      needs.changes.outputs.core == 'true' ||
      (matrix.proxy-type == 'npm' && needs.changes.outputs.npm == 'true') ||
      (matrix.proxy-type == 'maven' && needs.changes.outputs.maven == 'true') ||
      (matrix.proxy-type == 'docker' && needs.changes.outputs.docker == 'true') ||
      (matrix.proxy-type == 'apt' && needs.changes.outputs.apt == 'true') ||
      (matrix.proxy-type == 'pip' && needs.changes.outputs.pip == 'true') ||
      (matrix.proxy-type == 'yum' && needs.changes.outputs.yum == 'true') ||
      (matrix.proxy-type == 'apk' && needs.changes.outputs.apk == 'true')
    strategy:
      matrix:
        proxy-type: [maven, npm, apt, docker, pip, yum, apk]
        go-version: ['1.21', '1.22']
        include:
          # 높은 우선순위 프록시는 두 Go 버전 모두 테스트
          - proxy-type: npm
            priority: high
          - proxy-type: maven
            priority: high
          - proxy-type: docker
            priority: medium
        exclude:
          # 낮은 우선순위 프록시는 최신 Go 버전만 테스트
          - proxy-type: apk
            go-version: '1.21'
          - proxy-type: yum
            go-version: '1.21'
      fail-fast: false
    services:
      redis:
        image: redis:7.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Setup test environment
        run: |
          mkdir -p tmp/config tmp/storage
          cp -r examples/proxy-types/*.yaml tmp/config/ 2>/dev/null || echo "No example configs found"
          cp -r sample-conf/* tmp/config/ 2>/dev/null || echo "No sample config found"

      # Step 3: 캐시 최적화 - 통합 테스트용 향상된 캐시
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go-version }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go-version }}-
            ${{ runner.os }}-go-

      - name: Cache upstream fixtures
        uses: actions/cache@v4
        with:
          path: tests/e2e/upstream-data
          key: upstream-fixtures-${{ matrix.proxy-type }}-v2-${{ hashFiles('tests/e2e/upstream-data/**') }}
          restore-keys: |
            upstream-fixtures-${{ matrix.proxy-type }}-v2-
            upstream-fixtures-${{ matrix.proxy-type }}-

      - name: Run integration tests for ${{ matrix.proxy-type }}
        run: |
          export CONFIG_DIR=./tmp/config
          export STORAGE_DIR=./tmp/storage
          export REDIS_URL=redis://localhost:6379
          export PROXY_TYPE=${{ matrix.proxy-type }}

          # Run specific integration tests for the proxy type
          go test -tags=integration -v ./tests/integration/${{ matrix.proxy-type }}_integration_test.go || \
          go test -tags=integration -v ./tests/integration/integration_test.go -run "Test.*${{ matrix.proxy-type | title }}" || \
          echo "No integration tests found for ${{ matrix.proxy-type }}"

      # Step 4: 테스트 결과 수집 자동화
      - name: Collect integration test logs and coverage
        if: always()
        run: |
          mkdir -p test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}

          # 로그 수집
          cp -r logs/* test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}/ 2>/dev/null || echo "No logs to collect"

          # 커버리지 리포트 생성
          if [ -f coverage.out ]; then
            go tool cover -html=coverage.out -o test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}/coverage.html
            go tool cover -func=coverage.out > test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}/coverage.txt
          fi

          # 실패 시 디버깅 정보 수집
          if [ $? -ne 0 ]; then
            echo "Test failed, collecting debug info..."
            go version > test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}/debug-info.txt
            env | grep -E "(CONFIG|STORAGE|REDIS)" >> test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}/debug-info.txt
            ps aux | grep -E "(proxynd|redis)" >> test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}/debug-info.txt
          fi

          ls -la test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}/ || echo "No test results"

      - name: Upload integration test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-results-${{ matrix.proxy-type }}-go${{ matrix.go-version }}
          path: test-results/${{ matrix.proxy-type }}-go${{ matrix.go-version }}/
          retention-days: 7

  # 🌐 플랫폼별 E2E 테스트 (Step 1-3: 계층화된 테스트 매트릭스 - 핵심 타입만)
  e2e:
    name: E2E Test (${{ matrix.proxy-type }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: integration
    if: github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        proxy-type: [maven, npm, docker]  # 핵심 타입만 E2E 테스트
        os: [ubuntu-latest, macos-latest]
        include:
          # 우선순위 기반 매트릭스 확장
          - proxy-type: npm
            priority: high
            timeout: 10
          - proxy-type: maven
            priority: high
            timeout: 15
          - proxy-type: docker
            priority: medium
            timeout: 20
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup test environment
        run: |
          mkdir -p tmp/config tmp/storage
          cp -r examples/proxy-types/*.yaml tmp/config/ 2>/dev/null || echo "No example configs found"

      - name: Cache upstream fixtures
        uses: actions/cache@v4
        with:
          path: tests/e2e/upstream-data
          key: e2e-fixtures-${{ matrix.proxy-type }}-${{ hashFiles('tests/e2e/upstream-data/**') }}
          restore-keys: |
            e2e-fixtures-${{ matrix.proxy-type }}-

      - name: Start ProxyND container
        run: |
          export CONFIG_DIR=./tmp/config
          export STORAGE_DIR=./tmp/storage
          export SERVER_PORT=8080
          docker-compose -f docker-compose.e2e.yml up -d proxynd

      - name: Wait for ProxyND to be ready
        run: |
          timeout 60 bash -c 'until curl -f http://localhost:8080/healthz; do sleep 2; done'

      - name: Run E2E tests for ${{ matrix.proxy-type }}
        run: |
          export PROXY_TYPE=${{ matrix.proxy-type }}
          if [ -f "tests/e2e/scripts/test-${{ matrix.proxy-type }}.sh" ]; then
            chmod +x tests/e2e/scripts/test-${{ matrix.proxy-type }}.sh
            tests/e2e/scripts/test-${{ matrix.proxy-type }}.sh
          else
            echo "No E2E script found for ${{ matrix.proxy-type }}"
            exit 0
          fi

      - name: Collect E2E logs
        if: always()
        run: |
          mkdir -p e2e-results/${{ matrix.proxy-type }}
          docker-compose -f docker-compose.e2e.yml logs proxynd > e2e-results/${{ matrix.proxy-type }}/proxynd.log
          cp -r tmp/storage/* e2e-results/${{ matrix.proxy-type }}/ 2>/dev/null || echo "No storage to collect"

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results-${{ matrix.proxy-type }}
          path: e2e-results/${{ matrix.proxy-type }}/
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          docker-compose -f docker-compose.e2e.yml down -v

  # 🎯 배포 (develop → staging)
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [build, integration, e2e]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.proxynd.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging..."
          # kubectl apply -f k8s/staging/ 또는 helm 명령어
          echo "✅ Staging deployment completed"

      - name: Smoke test
        run: |
          echo "🧪 Running smoke tests..."

          # 기본 헬스체크
          curl -f https://staging.proxynd.example.com/healthz || {
            echo "❌ Basic health check failed"
            exit 1
          }

          # 어댑터 헬스체크 (스크립트 사용)
          chmod +x scripts/smoke-test-adapters.sh
          scripts/smoke-test-adapters.sh \
            --endpoint=https://staging.proxynd.example.com \
            --timeout=30 \
            --verbose

          echo "✅ All smoke tests passed"

  # 📊 결과 요약
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [quick-tests, security, build, integration, e2e, deploy-staging]
    if: always()
    steps:
      - name: Generate summary
        run: |
          echo "## 🚀 CI/CD Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test & Lint | ${{ needs.quick-tests.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Matrix | ${{ needs.integration.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Matrix | ${{ needs.e2e.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Staging | ${{ needs.deploy-staging.result }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [[ "${{ needs.quick-tests.result }}" == "success" && "${{ needs.security.result }}" == "success" && "${{ needs.build.result }}" == "success" && "${{ needs.integration.result }}" == "success" && "${{ needs.e2e.result }}" == "success" ]]; then
            echo "✅ **All checks passed!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Some checks failed**" >> $GITHUB_STEP_SUMMARY
          fi
