name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop, 'release/*', 'hotfix/*' ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:
    inputs:
      run_performance_tests:
        description: 'Run performance tests'
        type: boolean
        required: false
        default: false
      run_security_scan:
        description: 'Run security scans'
        type: boolean
        required: false
        default: true

env:
  GO_VERSION: '1.22'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  COVERAGE_THRESHOLD: 80

permissions:
  contents: read
  packages: write
  security-events: write
  id-token: write  # OIDC 지원

jobs:
  # 코드 품질 게이트
  code-quality:
    name: Code Quality Gate
    runs-on: ubuntu-latest
    outputs:
      quality-passed: ${{ steps.quality-check.outputs.passed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run go fmt
        run: |
          fmt_files=$(gofmt -l .)
          if [ -n "$fmt_files" ]; then
            echo "The following files need formatting:"
            echo "$fmt_files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run go mod tidy
        run: |
          go mod tidy
          if [ -n "$(git diff --exit-code go.mod go.sum)" ]; then
            echo "go.mod or go.sum is not tidy. Please run 'go mod tidy'"
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          only-new-issues: true
          args: --timeout=10m --out-format=github-actions

      - name: Check TODO/FIXME count
        run: |
          todo_count=$(find . -name "*.go" -exec grep -i "todo\|fixme" {} + | wc -l)
          echo "Current TODO/FIXME count: $todo_count"
          if [ "$todo_count" -gt 50 ]; then
            echo "❌ Too many TODO/FIXME items ($todo_count > 50)"
            exit 1
          else
            echo "✅ TODO/FIXME count acceptable ($todo_count/50)"
          fi

      - name: Set quality check output
        id: quality-check
        run: echo "passed=true" >> $GITHUB_OUTPUT

  # 테스트 실행
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: code-quality
    strategy:
      matrix:
        test-type: [unit, integration, handlers]
        go: ['1.22']
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          go mod verify

      - name: Create test environment
        run: |
          mkdir -p tmp/test-cache
          mkdir -p tmp/test-config
          mkdir -p reports/coverage

      - name: Run unit tests
        if: matrix.test-type == 'unit'
        run: |
          go test -v -race -coverprofile=reports/coverage/unit.out -covermode=atomic ./... -short

      - name: Run integration tests
        if: matrix.test-type == 'integration'
        run: |
          make test-integration || echo "Integration tests not configured"

      - name: Run handler tests
        if: matrix.test-type == 'handlers'
        run: |
          go test -v -race -coverprofile=reports/coverage/handlers.out ./handlers/...

      - name: Check test coverage
        if: matrix.test-type == 'unit'
        run: |
          go tool cover -func=reports/coverage/unit.out > coverage-summary.txt
          coverage=$(grep "total:" coverage-summary.txt | awk '{print $3}' | sed 's/%//' || echo "0")
          echo "Test coverage: ${coverage}%"

          if (( $(echo "$coverage < $COVERAGE_THRESHOLD" | bc -l) )); then
            echo "❌ Coverage below threshold: ${coverage}% < ${COVERAGE_THRESHOLD}%"
            exit 1
          else
            echo "✅ Coverage meets threshold: ${coverage}% >= ${COVERAGE_THRESHOLD}%"
          fi

      - name: Upload coverage to Codecov
        if: matrix.test-type == 'unit'
        uses: codecov/codecov-action@v5
        with:
          file: ./reports/coverage/unit.out
          flags: unittests
          name: codecov-umbrella

  # 성능 테스트 (선택적)
  performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event.inputs.run_performance_tests == 'true' || github.event_name == 'schedule'
    needs: test
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=3 -run=^$ ./... | tee benchmark_results.txt

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark_results.txt

  # 빌드 테스트
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build ProxyND server
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}-${GITHUB_SHA::8}"
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_SHA=${GITHUB_SHA::8}

          output_name=proxynd-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            output_name="${output_name}.exe"
          fi

          go build \
            -ldflags="-w -s -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -X main.CommitSHA=${COMMIT_SHA}" \
            -trimpath \
            -o dist/${output_name} \
            main.go

      - name: Build ProxyND CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION="${GITHUB_REF_NAME}-${GITHUB_SHA::8}"
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          COMMIT_SHA=${GITHUB_SHA::8}

          output_name=proxyndctl-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            output_name="${output_name}.exe"
          fi

          go build \
            -ldflags="-w -s -X main.Version=${VERSION} -X main.BuildTime=${BUILD_TIME} -X main.CommitSHA=${COMMIT_SHA}" \
            -trimpath \
            -o dist/${output_name} \
            ./cmd/proxyndctl/main.go

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/

  # Docker 이미지 빌드
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [code-quality, test]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials (OIDC)
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1
        continue-on-error: true

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 기본 보안 스캔
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    if: github.event.inputs.run_security_scan == 'true' || github.event_name != 'workflow_dispatch'
    needs: docker
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # 배포 준비 확인
  deployment-readiness:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [build, docker, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Check deployment readiness
        run: |
          echo "✅ Code quality checks passed"
          echo "✅ All tests passed"
          echo "✅ Build successful for all platforms"
          echo "✅ Docker image built successfully"
          echo "✅ Security scans completed"
          echo "🚀 Ready for deployment"

      - name: Notify deployment readiness
        run: |
          echo "Deployment readiness check completed successfully"
          echo "All quality gates passed - ready for production deployment"
