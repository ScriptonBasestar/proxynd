name: Continuous Performance Monitoring

on:
  schedule:
    - cron: '0 */6 * * *'  # 6시간마다 실행
  workflow_dispatch:
    inputs:
      benchmark_duration:
        description: 'Benchmark duration'
        required: false
        type: choice
        options:
          - '30s'
          - '1m'
          - '5m'
          - '10m'
        default: '1m'
      load_test_enabled:
        description: 'Enable load testing'
        type: boolean
        required: false
        default: true

env:
  GO_VERSION: '1.23'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  # 성능 벤치마크
  performance-benchmark:
    name: Performance Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run benchmarks
        run: |
          go test -bench=. -benchmem -count=5 -run=^$ ./... | tee benchmark_results.txt

      - name: Analyze benchmark trends
        run: |
          # 성능 트렌드 분석 스크립트
          cat > analyze_performance.go << 'EOF'
          package main

          import (
            "bufio"
            "fmt"
            "os"
            "regexp"
            "strconv"
            "strings"
          )

          func main() {
            file, err := os.Open("benchmark_results.txt")
            if err != nil {
              fmt.Printf("Error opening file: %v\n", err)
              return
            }
            defer file.Close()

            scanner := bufio.NewScanner(file)
            benchRe := regexp.MustCompile(`^Benchmark(\w+)\s+(\d+)\s+([\d.]+)\s+(\w+/op)`)

            fmt.Println("## 📊 Performance Benchmark Results")
            fmt.Println("")
            fmt.Println("| Benchmark | Iterations | ns/op | Status |")
            fmt.Println("|-----------|------------|-------|--------|")

            for scanner.Scan() {
              line := scanner.Text()
              if matches := benchRe.FindStringSubmatch(line); matches != nil {
                name := matches[1]
                iterations := matches[2]
                nsPerOp, _ := strconv.ParseFloat(matches[3], 64)

                status := "✅ Good"
                if nsPerOp > 1000000 { // 1ms 이상
                  status = "⚠️ Slow"
                }
                if nsPerOp > 10000000 { // 10ms 이상
                  status = "❌ Critical"
                }

                fmt.Printf("| %s | %s | %.0f | %s |\n", name, iterations, nsPerOp, status)
              }
            }
          }
          EOF

          go run analyze_performance.go > performance_summary.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            benchmark_results.txt
            performance_summary.md

  # 메모리 프로파일링
  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run memory profiling
        run: |
          go test -memprofile=mem.prof -run=^$ -bench=. ./...

          # 메모리 사용량 분석
          go tool pprof -text -alloc_space mem.prof > memory_analysis.txt
          go tool pprof -text -alloc_objects mem.prof > memory_objects.txt

      - name: Generate memory report
        run: |
          echo "## 🧠 Memory Profiling Report" > memory_report.md
          echo "" >> memory_report.md
          echo "### Top Memory Allocations:" >> memory_report.md
          echo "\`\`\`" >> memory_report.md
          head -20 memory_analysis.txt >> memory_report.md
          echo "\`\`\`" >> memory_report.md
          echo "" >> memory_report.md
          echo "### Top Object Allocations:" >> memory_report.md
          echo "\`\`\`" >> memory_report.md
          head -20 memory_objects.txt >> memory_report.md
          echo "\`\`\`" >> memory_report.md

      - name: Upload memory profile
        uses: actions/upload-artifact@v4
        with:
          name: memory-profile
          path: |
            mem.prof
            memory_*.txt
            memory_report.md

  # 라이브 서버 모니터링
  live-monitoring:
    name: Live Server Monitoring
    runs-on: ubuntu-latest
    if: github.event.inputs.load_test_enabled == 'true' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build and start ProxyND
        run: |
          go build -o proxynd main.go
          ./proxynd &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # 서버 시작 대기
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null; then
              echo "Server is ready"
              break
            fi
            echo "Waiting for server to start... ($i/30)"
            sleep 2
          done

      - name: Install monitoring tools
        run: |
          # k6 설치
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Run load test
        run: |
          # k6 로드 테스트 스크립트 생성
          cat > load-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate, Trend } from 'k6/metrics';

          export let errorRate = new Rate('errors');
          export let responseTime = new Trend('response_time');

          export let options = {
            stages: [
              { duration: '2m', target: 20 },   // Ramp up
              { duration: '3m', target: 50 },   // Stay at 50 users
              { duration: '2m', target: 100 },  // Ramp up to 100
              { duration: '5m', target: 100 },  // Stay at 100
              { duration: '2m', target: 0 },    // Ramp down
            ],
            thresholds: {
              http_req_duration: ['p(95)<500'],
              http_req_failed: ['rate<0.1'],
              errors: ['rate<0.1'],
            },
          };

          export default function() {
            // Health check
            let healthResponse = http.get('http://localhost:8080/health');
            check(healthResponse, {
              'health check status is 200': (r) => r.status === 200,
            }) || errorRate.add(1);

            responseTime.add(healthResponse.timings.duration);

            // Metrics endpoint
            let metricsResponse = http.get('http://localhost:8080/metrics');
            check(metricsResponse, {
              'metrics status is 200': (r) => r.status === 200,
            }) || errorRate.add(1);

            sleep(1);
          }
          EOF

          # 로드 테스트 실행
          duration="${{ github.event.inputs.benchmark_duration || '1m' }}"
          k6 run --duration $duration load-test.js --out json=load-test-results.json

      - name: Analyze load test results
        run: |
          # 로드 테스트 결과 분석
          cat > analyze_load_test.js << 'EOF'
          const fs = require('fs');

          const data = fs.readFileSync('load-test-results.json', 'utf8');
          const lines = data.trim().split('\n');

          let totalRequests = 0;
          let errors = 0;
          let responseTimes = [];

          lines.forEach(line => {
            try {
              const metric = JSON.parse(line);
              if (metric.type === 'Point' && metric.metric === 'http_reqs') {
                totalRequests += metric.data.value;
              }
              if (metric.type === 'Point' && metric.metric === 'http_req_failed') {
                errors += metric.data.value;
              }
              if (metric.type === 'Point' && metric.metric === 'http_req_duration') {
                responseTimes.push(metric.data.value);
              }
            } catch (e) {
              // Skip invalid JSON lines
            }
          });

          const errorRate = totalRequests > 0 ? (errors / totalRequests * 100).toFixed(2) : 0;
          const avgResponseTime = responseTimes.length > 0 ?
            (responseTimes.reduce((a, b) => a + b, 0) / responseTimes.length).toFixed(2) : 0;

          console.log(`## 🚀 Load Test Results`);
          console.log(``);
          console.log(`| Metric | Value |`);
          console.log(`|--------|-------|`);
          console.log(`| Total Requests | ${totalRequests} |`);
          console.log(`| Error Rate | ${errorRate}% |`);
          console.log(`| Avg Response Time | ${avgResponseTime}ms |`);
          console.log(`| Status | ${errorRate < 1 && avgResponseTime < 500 ? '✅ Good' : '⚠️ Needs Attention'} |`);
          EOF

          node analyze_load_test.js > load_test_summary.md

      - name: Stop server
        if: always()
        run: |
          kill ${{ env.SERVER_PID }} || true

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            load-test-results.json
            load_test_summary.md

  # 리소스 사용량 모니터링
  resource-monitoring:
    name: Resource Usage Monitoring
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Monitor build resource usage
        run: |
          # 빌드 시 리소스 사용량 모니터링
          echo "Starting resource monitoring..."

          # 시스템 정보 수집
          echo "## 💻 System Information" > resource_report.md
          echo "" >> resource_report.md
          echo "### CPU Information:" >> resource_report.md
          echo "\`\`\`" >> resource_report.md
          lscpu | head -10 >> resource_report.md
          echo "\`\`\`" >> resource_report.md
          echo "" >> resource_report.md

          echo "### Memory Information:" >> resource_report.md
          echo "\`\`\`" >> resource_report.md
          free -h >> resource_report.md
          echo "\`\`\`" >> resource_report.md
          echo "" >> resource_report.md

          echo "### Disk Information:" >> resource_report.md
          echo "\`\`\`" >> resource_report.md
          df -h >> resource_report.md
          echo "\`\`\`" >> resource_report.md

      - name: Monitor Go build performance
        run: |
          # Go 빌드 성능 측정
          echo "" >> resource_report.md
          echo "## ⚡ Build Performance" >> resource_report.md
          echo "" >> resource_report.md

          echo "### Build Times:" >> resource_report.md
          echo "| Target | Time |" >> resource_report.md
          echo "|--------|------|" >> resource_report.md

          start_time=$(date +%s%N)
          go build -o proxynd main.go
          end_time=$(date +%s%N)
          build_time=$(echo "scale=3; ($end_time - $start_time) / 1000000000" | bc)
          echo "| ProxyND Server | ${build_time}s |" >> resource_report.md

          start_time=$(date +%s%N)
          go build -o proxyndctl ./cmd/proxyndctl/main.go
          end_time=$(date +%s%N)
          build_time=$(echo "scale=3; ($end_time - $start_time) / 1000000000" | bc)
          echo "| ProxyND CLI | ${build_time}s |" >> resource_report.md

      - name: Upload resource report
        uses: actions/upload-artifact@v4
        with:
          name: resource-report
          path: resource_report.md

  # 성능 리포트 생성
  performance-report:
    name: Generate Performance Report
    runs-on: ubuntu-latest
    needs: [performance-benchmark, memory-profiling, live-monitoring, resource-monitoring]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5

      - name: Generate comprehensive report
        run: |
          echo "# 📊 ProxyND Performance Report" > comprehensive_report.md
          echo "" >> comprehensive_report.md
          echo "Generated: $(date)" >> comprehensive_report.md
          echo "" >> comprehensive_report.md

          # 벤치마크 결과 추가
          if [ -f benchmark-results/performance_summary.md ]; then
            cat benchmark-results/performance_summary.md >> comprehensive_report.md
            echo "" >> comprehensive_report.md
          fi

          # 메모리 프로파일 결과 추가
          if [ -f memory-profile/memory_report.md ]; then
            cat memory-profile/memory_report.md >> comprehensive_report.md
            echo "" >> comprehensive_report.md
          fi

          # 로드 테스트 결과 추가
          if [ -f load-test-results/load_test_summary.md ]; then
            cat load-test-results/load_test_summary.md >> comprehensive_report.md
            echo "" >> comprehensive_report.md
          fi

          # 리소스 사용량 추가
          if [ -f resource-report/resource_report.md ]; then
            cat resource-report/resource_report.md >> comprehensive_report.md
            echo "" >> comprehensive_report.md
          fi

          echo "## 📈 Recommendations" >> comprehensive_report.md
          echo "" >> comprehensive_report.md
          echo "- Monitor response times regularly" >> comprehensive_report.md
          echo "- Optimize memory allocations if needed" >> comprehensive_report.md
          echo "- Consider horizontal scaling for high load" >> comprehensive_report.md
          echo "- Review and tune garbage collection settings" >> comprehensive_report.md

      - name: Upload comprehensive report
        uses: actions/upload-artifact@v4
        with:
          name: comprehensive-performance-report
          path: comprehensive_report.md

      - name: Comment performance summary
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "📊 Performance monitoring completed successfully"
          echo "📋 Comprehensive report generated"
          echo "🔍 Check artifacts for detailed analysis"
