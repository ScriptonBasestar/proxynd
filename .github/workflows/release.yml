name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false
      deploy_staging:
        description: 'Deploy to staging environment'
        required: false
        type: boolean
        default: true
      deploy_production:
        description: 'Deploy to production environment'
        required: false
        type: boolean
        default: false

env:
  GO_VERSION: '1.22'
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-release:
    name: Docker Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ secrets.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME }}/proxynd
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-release:
    name: Helm Chart Release
    runs-on: ubuntu-latest
    needs: [docker-release]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.0

      - name: Update Chart Version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          sed -i "s/version: .*/version: $VERSION/" helm/Chart.yaml
          sed -i "s/appVersion: .*/appVersion: $VERSION/" helm/Chart.yaml

      - name: Package Helm Chart
        run: |
          helm package helm/ -d .deploy

      - name: Update Helm Repository Index
        run: |
          helm repo index .deploy --url https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}

      - name: Upload Helm Chart
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .deploy/*.tgz
            .deploy/index.yaml

  create-release-notes:
    name: Create Release Notes
    runs-on: ubuntu-latest
    needs: [goreleaser, docker-release, helm-release]
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          configuration: ".github/changelog-config.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.changelog }}

            ## Docker Images

            ```bash
            # GitHub Container Registry
            docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }}

            # Docker Hub (if configured)
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/proxynd:${{ github.ref_name }}
            ```

            ## Helm Installation

            ```bash
            helm repo add proxynd https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}
            helm repo update
            helm install proxynd proxynd/proxynd
            ```

            ## Binary Downloads

            See the Assets section below for pre-compiled binaries for your platform.

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [goreleaser]
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Gosec security scanner
        run: |
          go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest
          gosec -fmt sarif -out gosec-results.sarif ./...

      - name: Upload Gosec scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'gosec-results.sarif'

      - name: Dependency vulnerability scan
        run: |
          go install github.com/sonatypecommunity/nancy@latest
          go list -json -m all | nancy sleuth

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker-release, security-scan]
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_staging == 'true') ||
      (github.event_name == 'push' && contains(github.ref, 'staging')) ||
      (github.event_name == 'push' && contains(github.ref, 'rc'))
    environment:
      name: staging
      url: https://staging.proxynd.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.0

      - name: Deploy to staging
        run: |
          # Set version
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi

          echo "Deploying version: $VERSION to staging"

          # Add kubeconfig (placeholder - configure with actual cluster credentials)
          # echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > kubeconfig
          # export KUBECONFIG=kubeconfig

          # Helm upgrade/install
          helm upgrade --install proxynd-staging ./helm \
            --namespace proxynd-staging \
            --create-namespace \
            --set image.tag=$VERSION \
            --set environment=staging \
            --set ingress.hosts[0].host=staging.proxynd.example.com \
            --set resources.requests.memory=512Mi \
            --set resources.requests.cpu=250m \
            --set replicaCount=2 \
            --wait --timeout=300s

          echo "Staging deployment completed successfully"

      - name: Run staging health check
        run: |
          echo "Running health checks on staging environment..."
          # Add actual health check commands
          # curl -f https://staging.proxynd.example.com/health || exit 1
          echo "Staging health check passed"

      - name: Run staging smoke tests
        run: |
          echo "Running smoke tests on staging..."
          # Add actual smoke test commands
          # ./scripts/smoke-tests.sh staging.proxynd.example.com
          echo "Staging smoke tests passed"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-staging, helm-release]
    if: |
      (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_production == 'true') ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-'))
    environment:
      name: production
      url: https://proxynd.example.com
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Configure kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.28.0'

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.0

      - name: Deploy to production
        run: |
          # Set version
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi

          echo "Deploying version: $VERSION to production"

          # Add kubeconfig (placeholder - configure with actual cluster credentials)
          # echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > kubeconfig
          # export KUBECONFIG=kubeconfig

          # Production deployment with rolling update strategy
          helm upgrade --install proxynd ./helm \
            --namespace proxynd \
            --create-namespace \
            --set image.tag=$VERSION \
            --set environment=production \
            --set ingress.hosts[0].host=proxynd.example.com \
            --set resources.requests.memory=1Gi \
            --set resources.requests.cpu=500m \
            --set resources.limits.memory=2Gi \
            --set resources.limits.cpu=1000m \
            --set replicaCount=3 \
            --set autoscaling.enabled=true \
            --set autoscaling.minReplicas=3 \
            --set autoscaling.maxReplicas=10 \
            --wait --timeout=600s

          echo "Production deployment completed successfully"

      - name: Run production health check
        run: |
          echo "Running health checks on production environment..."
          # Add actual health check commands
          # curl -f https://proxynd.example.com/health || exit 1
          echo "Production health check passed"

      - name: Run production verification tests
        run: |
          echo "Running verification tests on production..."
          # Add actual verification test commands
          # ./scripts/verification-tests.sh proxynd.example.com
          echo "Production verification tests passed"

  rollback-staging:
    name: Rollback Staging
    runs-on: ubuntu-latest
    if: failure() && needs.deploy-staging.result == 'failure'
    needs: [deploy-staging]
    environment: staging
    steps:
      - name: Rollback staging deployment
        run: |
          echo "Rolling back staging deployment..."
          # Add rollback logic
          # helm rollback proxynd-staging --namespace proxynd-staging
          echo "Staging rollback completed"

  rollback-production:
    name: Rollback Production
    runs-on: ubuntu-latest
    if: failure() && needs.deploy-production.result == 'failure'
    needs: [deploy-production]
    environment: production
    steps:
      - name: Rollback production deployment
        run: |
          echo "Rolling back production deployment..."
          # Add rollback logic
          # helm rollback proxynd --namespace proxynd
          echo "Production rollback completed"

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [create-release-notes, deploy-production]
    if: success()
    steps:
      - name: Notify release success
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi

          echo "🎉 Release $VERSION completed successfully!"
          echo "✅ Docker images published"
          echo "✅ Helm charts released"
          echo "✅ Staging deployment completed"
          echo "✅ Production deployment completed"

          # Add notification integrations (Slack, Teams, etc.)
          # Example Slack notification:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data "{\"text\":\"🎉 ProxyND $VERSION released successfully! Docker: ghcr.io/${{ github.repository }}:$VERSION\"}" \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [goreleaser, docker-release, helm-release, deploy-staging, deploy-production]
    if: failure()
    steps:
      - name: Notify release failure
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi

          echo "❌ Release $VERSION failed!"
          echo "Failed jobs:"
          echo "- GoReleaser: ${{ needs.goreleaser.result }}"
          echo "- Docker Release: ${{ needs.docker-release.result }}"
          echo "- Helm Release: ${{ needs.helm-release.result }}"
          echo "- Staging Deploy: ${{ needs.deploy-staging.result }}"
          echo "- Production Deploy: ${{ needs.deploy-production.result }}"

          # Add notification integrations
          # Example Slack notification:
          # curl -X POST -H 'Content-type: application/json' \
          #   --data "{\"text\":\"❌ ProxyND $VERSION release failed! Check GitHub Actions for details.\"}" \
          #   ${{ secrets.SLACK_WEBHOOK_URL }}
