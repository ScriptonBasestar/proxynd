# 🚀 ProxyND Release
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  GO_VERSION: '1.23'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 🔒 Pre-release security check
  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Critical vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: License check
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./...

  # 📦 GoReleaser
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    needs: security-check
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "🏷️ Version: $VERSION"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 🐳 Docker Release
  docker:
    name: Docker Release
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: secrets.DOCKERHUB_USERNAME
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME && format('{0}/proxynd', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.multiarch
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ⎈ Helm Release
  helm:
    name: Helm Release
    runs-on: ubuntu-latest
    needs: [goreleaser, docker]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.13.0

      - name: Package and upload Helm chart
        run: |
          VERSION=${{ needs.goreleaser.outputs.version }}
          VERSION=${VERSION#v}  # Remove 'v' prefix

          # Update chart version
          sed -i "s/version: .*/version: $VERSION/" deployments/helm/Chart.yaml
          sed -i "s/appVersion: .*/appVersion: $VERSION/" deployments/helm/Chart.yaml

          # Package chart
          mkdir -p .deploy
          helm package deployments/helm/ -d .deploy

          # Upload to GitHub release
          gh release upload ${{ needs.goreleaser.outputs.version }} .deploy/*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 🚀 Production Deploy (optional)
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [goreleaser, docker, helm]
    if: github.event_name == 'push' && !contains(github.ref, '-')  # Only stable releases
    environment:
      name: production
      url: https://proxynd.example.com
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Deploy to production
        run: |
          VERSION=${{ needs.goreleaser.outputs.version }}
          echo "🚀 Deploying $VERSION to production..."

          # Uncomment and configure for your environment:
          # helm upgrade --install proxynd ./helm \
          #   --namespace proxynd \
          #   --set image.tag=$VERSION \
          #   --set environment=production \
          #   --wait --timeout=600s

          echo "✅ Production deployment completed"

      - name: Health check
        run: |
          echo "🏥 Running health checks..."
          # curl -f https://proxynd.example.com/health
          echo "✅ Health checks passed"

  # 🎉 Success notification
  notify:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [goreleaser, docker, helm]
    if: success()
    steps:
      - name: Create release summary
        run: |
          VERSION=${{ needs.goreleaser.outputs.version }}

          echo "## 🎉 Release $VERSION Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- 🐳 Docker: \`ghcr.io/${{ github.repository }}:$VERSION\`" >> $GITHUB_STEP_SUMMARY
          echo "- ⎈ Helm: Available in [releases](https://github.com/${{ github.repository }}/releases/$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "- 📥 Binaries: Available in [releases](https://github.com/${{ github.repository }}/releases/$VERSION)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🚀 Quick Start:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "# Docker" >> $GITHUB_STEP_SUMMARY
          echo "docker run ghcr.io/${{ github.repository }}:$VERSION" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "# Helm" >> $GITHUB_STEP_SUMMARY
          echo "helm install proxynd oci://ghcr.io/${{ github.repository }}/helm --version $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      # Optional: Add Slack/Discord notification
      # - name: Notify Slack
      #   run: |
      #     curl -X POST -H 'Content-type: application/json' \
      #       --data '{"text":"🎉 ProxyND ${{ needs.goreleaser.outputs.version }} released!"}' \
      #       ${{ secrets.SLACK_WEBHOOK_URL }}
