# ⚡ ProxyND Performance Benchmarks
name: Performance

on:
  schedule:
    - cron: '0 2 * * 1'  # Weekly on Monday 2 AM UTC
  workflow_dispatch:
    inputs:
      benchmark_type:
        description: 'Benchmark type'
        type: choice
        options:
          - all
          - cpu
          - memory
          - load
        default: 'all'
      duration:
        description: 'Test duration'
        type: choice
        options:
          - '30s'
          - '1m'
          - '5m'
          - '10m'
        default: '1m'

env:
  GO_VERSION: '1.23'

jobs:
  # 🧪 Go Benchmarks
  go-benchmarks:
    name: Go Benchmarks
    runs-on: ubuntu-latest
    if: github.event.inputs.benchmark_type == 'all' || github.event.inputs.benchmark_type == 'cpu' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run benchmarks
        run: |
          echo "🏃‍♂️ Running Go benchmarks..."
          go test -bench=. -benchmem -count=3 -run=^$ ./... | tee benchmark_results.txt

      - name: Analyze results
        run: |
          echo "## 📊 Go Benchmark Results" > benchmark_summary.md
          echo "" >> benchmark_summary.md
          echo "### Top CPU-intensive functions:" >> benchmark_summary.md
          echo '```' >> benchmark_summary.md
          grep -E "Benchmark.*-[0-9]+" benchmark_results.txt | sort -k3 -nr | head -10 >> benchmark_summary.md
          echo '```' >> benchmark_summary.md

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: go-benchmarks
          path: |
            benchmark_results.txt
            benchmark_summary.md

  # 🧠 Memory Profiling
  memory-profiling:
    name: Memory Profiling
    runs-on: ubuntu-latest
    if: github.event.inputs.benchmark_type == 'all' || github.event.inputs.benchmark_type == 'memory' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Memory profiling
        run: |
          echo "🧠 Running memory profiling..."
          go test -memprofile=mem.prof -run=^$ -bench=. ./...
          go tool pprof -text -alloc_space mem.prof > memory_analysis.txt

      - name: Generate memory report
        run: |
          echo "## 🧠 Memory Profile Report" > memory_report.md
          echo "" >> memory_report.md
          echo "### Top memory allocations:" >> memory_report.md
          echo '```' >> memory_report.md
          head -20 memory_analysis.txt >> memory_report.md
          echo '```' >> memory_report.md

      - name: Upload profiles
        uses: actions/upload-artifact@v4
        with:
          name: memory-profiles
          path: |
            mem.prof
            memory_*.txt
            memory_report.md

  # 🚀 Load Testing
  load-testing:
    name: Load Testing
    runs-on: ubuntu-latest
    if: github.event.inputs.benchmark_type == 'all' || github.event.inputs.benchmark_type == 'load' || github.event_name == 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build and start server
        run: |
          echo "🏗️ Building ProxyND..."
          go build -o proxynd main.go
          ./proxynd &
          SERVER_PID=$!
          echo "SERVER_PID=$SERVER_PID" >> $GITHUB_ENV

          # Wait for server
          for i in {1..30}; do
            if curl -s http://localhost:8080/health > /dev/null; then
              echo "✅ Server is ready"
              break
            fi
            echo "⏳ Waiting for server... ($i/30)"
            sleep 2
          done

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Create load test script
        run: |
          cat > load-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          import { Rate, Trend, Counter } from 'k6/metrics';

          export let errorRate = new Rate('errors');
          export let responseTime = new Trend('response_time');
          export let requestCount = new Counter('requests');

          export let options = {
            stages: [
              { duration: '30s', target: 10 },
              { duration: '${{ github.event.inputs.duration || ''1m'' }}', target: 50 },
              { duration: '30s', target: 0 },
            ],
            thresholds: {
              http_req_duration: ['p(95)<500'],
              http_req_failed: ['rate<0.1'],
              errors: ['rate<0.1'],
            },
          };

          export default function() {
            let response = http.get('http://localhost:8080/health');

            let success = check(response, {
              'status is 200': (r) => r.status === 200,
              'response time < 500ms': (r) => r.timings.duration < 500,
            });

            if (!success) {
              errorRate.add(1);
            }

            responseTime.add(response.timings.duration);
            requestCount.add(1);

            sleep(0.1);
          }
          EOF

      - name: Run load test
        run: |
          echo "🚀 Running load test..."
          k6 run --out json=load-test-results.json load-test.js

      - name: Generate load test report
        run: |
          echo "## 🚀 Load Test Results" > load_test_report.md
          echo "" >> load_test_report.md
          echo "**Duration:** ${{ github.event.inputs.duration || '1m' }}" >> load_test_report.md
          echo "**Date:** $(date)" >> load_test_report.md
          echo "" >> load_test_report.md

          # Parse results (simplified - you might want to use jq)
          TOTAL_REQUESTS=$(grep -o '"http_reqs"' load-test-results.json | wc -l)
          echo "**Total Requests:** $TOTAL_REQUESTS" >> load_test_report.md
          echo "" >> load_test_report.md
          echo "📊 Detailed results available in artifacts" >> load_test_report.md

      - name: Stop server
        if: always()
        run: kill ${{ env.SERVER_PID }} || true

      - name: Upload load test results
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            load-test-results.json
            load_test_report.md

  # 📊 Performance Report
  performance-report:
    name: Performance Report
    runs-on: ubuntu-latest
    needs: [go-benchmarks, memory-profiling, load-testing]
    if: always()
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5

      - name: Generate comprehensive report
        run: |
          echo "# 📊 ProxyND Performance Report" > performance_report.md
          echo "" >> performance_report.md
          echo "**Generated:** $(date)" >> performance_report.md
          echo "**Trigger:** ${{ github.event_name }}" >> performance_report.md
          echo "" >> performance_report.md

          echo "## 📈 Summary" >> performance_report.md
          echo "| Test | Status | Report |" >> performance_report.md
          echo "|------|--------|--------|" >> performance_report.md
          echo "| Go Benchmarks | ${{ needs.go-benchmarks.result }} | [📊](./go-benchmarks/) |" >> performance_report.md
          echo "| Memory Profiling | ${{ needs.memory-profiling.result }} | [🧠](./memory-profiles/) |" >> performance_report.md
          echo "| Load Testing | ${{ needs.load-testing.result }} | [🚀](./load-test-results/) |" >> performance_report.md
          echo "" >> performance_report.md

          # Include individual reports if they exist
          if [ -f "go-benchmarks/benchmark_summary.md" ]; then
            cat go-benchmarks/benchmark_summary.md >> performance_report.md
            echo "" >> performance_report.md
          fi

          if [ -f "memory-profiles/memory_report.md" ]; then
            cat memory-profiles/memory_report.md >> performance_report.md
            echo "" >> performance_report.md
          fi

          if [ -f "load-test-results/load_test_report.md" ]; then
            cat load-test-results/load_test_report.md >> performance_report.md
            echo "" >> performance_report.md
          fi

          echo "## 🎯 Recommendations" >> performance_report.md
          echo "- Monitor response times during peak load" >> performance_report.md
          echo "- Consider memory optimization for high-allocation functions" >> performance_report.md
          echo "- Review error rates and implement circuit breakers if needed" >> performance_report.md

      - name: Upload comprehensive report
        uses: actions/upload-artifact@v4
        with:
          name: performance-report
          path: performance_report.md

      - name: Update job summary
        run: |
          cat performance_report.md >> $GITHUB_STEP_SUMMARY
