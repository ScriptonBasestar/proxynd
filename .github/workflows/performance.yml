name: Performance Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run performance tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      benchmark_time:
        description: 'Benchmark duration (e.g., 30s, 5m)'
        required: false
        default: '30s'
      compare_baseline:
        description: 'Compare with baseline'
        type: boolean
        required: false
        default: true

env:
  GO_VERSION: '1.22'
  BENCHMARK_TIME: ${{ github.event.inputs.benchmark_time || '30s' }}

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        benchmark_type: [cache, proxy, middleware, config]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for baseline comparison

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          go mod verify

      - name: Setup benchmark environment
        run: |
          mkdir -p reports/benchmarks
          mkdir -p tmp/benchmark-cache
          chmod +x scripts/run-benchmarks.sh

      - name: Run benchmarks
        run: |
          case "${{ matrix.benchmark_type }}" in
            "cache")
              go test -bench=BenchmarkCacheSimple -benchmem -benchtime=${{ env.BENCHMARK_TIME }} ./test/benchmark/ -run=^$ > reports/benchmarks/cache_${{ github.sha }}.txt
              go test -bench=BenchmarkCacheDataSizes -benchmem -benchtime=${{ env.BENCHMARK_TIME }} ./test/benchmark/ -run=^$ >> reports/benchmarks/cache_${{ github.sha }}.txt
              go test -bench=BenchmarkCacheConcurrency -benchmem -benchtime=${{ env.BENCHMARK_TIME }} ./test/benchmark/ -run=^$ >> reports/benchmarks/cache_${{ github.sha }}.txt
              ;;
            "proxy")
              go test -bench=BenchmarkProxyThroughput -benchmem -benchtime=${{ env.BENCHMARK_TIME }} ./test/benchmark/ -run=^$ > reports/benchmarks/proxy_${{ github.sha }}.txt
              go test -bench=BenchmarkProxyConcurrency -benchmem -benchtime=${{ env.BENCHMARK_TIME }} ./test/benchmark/ -run=^$ >> reports/benchmarks/proxy_${{ github.sha }}.txt
              ;;
            "middleware")
              go test -bench=BenchmarkMiddlewareStack -benchmem -benchtime=${{ env.BENCHMARK_TIME }} ./test/benchmark/ -run=^$ > reports/benchmarks/middleware_${{ github.sha }}.txt
              go test -bench=BenchmarkLoggingMiddleware -benchmem -benchtime=${{ env.BENCHMARK_TIME }} ./test/benchmark/ -run=^$ >> reports/benchmarks/middleware_${{ github.sha }}.txt
              ;;
            "config")
              go test -bench=BenchmarkConfigLoading -benchmem -benchtime=${{ env.BENCHMARK_TIME }} ./test/benchmark/ -run=^$ > reports/benchmarks/config_${{ github.sha }}.txt
              go test -bench=BenchmarkConfigValidation -benchmem -benchtime=${{ env.BENCHMARK_TIME }} ./test/benchmark/ -run=^$ >> reports/benchmarks/config_${{ github.sha }}.txt
              ;;
          esac

      - name: Run memory benchmarks
        if: matrix.benchmark_type == 'cache'
        run: |
          go test -bench=BenchmarkCacheMemory -benchmem -benchtime=${{ env.BENCHMARK_TIME }} ./test/benchmark/ -run=^$ >> reports/benchmarks/memory_${{ github.sha }}.txt
          go test -bench=BenchmarkCacheSizes -benchmem -benchtime=${{ env.BENCHMARK_TIME }} ./test/benchmark/ -run=^$ >> reports/benchmarks/cache_sizes_${{ github.sha }}.txt

      - name: Generate performance report
        run: |
          echo "# Performance Benchmark Report" > reports/benchmarks/summary_${{ matrix.benchmark_type }}_${{ github.sha }}.md
          echo "" >> reports/benchmarks/summary_${{ matrix.benchmark_type }}_${{ github.sha }}.md
          echo "**Commit**: ${{ github.sha }}" >> reports/benchmarks/summary_${{ matrix.benchmark_type }}_${{ github.sha }}.md
          echo "**Branch**: ${{ github.ref_name }}" >> reports/benchmarks/summary_${{ matrix.benchmark_type }}_${{ github.sha }}.md
          echo "**Date**: $(date -u)" >> reports/benchmarks/summary_${{ matrix.benchmark_type }}_${{ github.sha }}.md
          echo "**Benchmark Type**: ${{ matrix.benchmark_type }}" >> reports/benchmarks/summary_${{ matrix.benchmark_type }}_${{ github.sha }}.md
          echo "**Duration**: ${{ env.BENCHMARK_TIME }}" >> reports/benchmarks/summary_${{ matrix.benchmark_type }}_${{ github.sha }}.md
          echo "" >> reports/benchmarks/summary_${{ matrix.benchmark_type }}_${{ github.sha }}.md
          echo "## Results" >> reports/benchmarks/summary_${{ matrix.benchmark_type }}_${{ github.sha }}.md
          echo "\`\`\`" >> reports/benchmarks/summary_${{ matrix.benchmark_type }}_${{ github.sha }}.md
          if [ -f "reports/benchmarks/${{ matrix.benchmark_type }}_${{ github.sha }}.txt" ]; then
            cat reports/benchmarks/${{ matrix.benchmark_type }}_${{ github.sha }}.txt >> reports/benchmarks/summary_${{ matrix.benchmark_type }}_${{ github.sha }}.md
          fi
          echo "\`\`\`" >> reports/benchmarks/summary_${{ matrix.benchmark_type }}_${{ github.sha }}.md

      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.benchmark_type }}-${{ github.sha }}
          path: reports/benchmarks/
          retention-days: 30

  performance-regression:
    name: Performance Regression Check
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports/current/

      - name: Get baseline benchmarks
        run: |
          # Try to get baseline from main/master branch
          git checkout ${{ github.event.pull_request.base.sha }} || git checkout origin/${{ github.event.pull_request.base.ref }}
          mkdir -p reports/baseline/
          
          # Run baseline benchmarks (quick version)
          go test -bench=BenchmarkCacheSimple -benchmem -benchtime=5s ./test/benchmark/ -run=^$ > reports/baseline/cache_baseline.txt || echo "Baseline benchmark failed"

      - name: Install benchcmp
        run: |
          go install golang.org/x/tools/cmd/benchcmp@latest

      - name: Compare performance
        run: |
          echo "# Performance Comparison Report" > performance-comparison.md
          echo "" >> performance-comparison.md
          echo "Comparing performance between base branch and current PR:" >> performance-comparison.md
          echo "" >> performance-comparison.md
          
          if [ -f "reports/baseline/cache_baseline.txt" ] && [ -f "reports/current/benchmark-results-cache-${{ github.sha }}/cache_${{ github.sha }}.txt" ]; then
            echo "## Cache Performance" >> performance-comparison.md
            echo "\`\`\`" >> performance-comparison.md
            benchcmp reports/baseline/cache_baseline.txt reports/current/benchmark-results-cache-${{ github.sha }}/cache_${{ github.sha }}.txt >> performance-comparison.md || echo "No significant changes detected" >> performance-comparison.md
            echo "\`\`\`" >> performance-comparison.md
          else
            echo "## Cache Performance" >> performance-comparison.md
            echo "Baseline or current benchmarks not available for comparison." >> performance-comparison.md
          fi

      - name: Comment PR with performance results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'No performance comparison available.';
            
            try {
              body = fs.readFileSync('performance-comparison.md', 'utf8');
            } catch (error) {
              console.log('Performance comparison file not found:', error);
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

  benchmark-trending:
    name: Performance Trending
    runs-on: ubuntu-latest
    needs: benchmark
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports/

      - name: Store benchmark history
        run: |
          # Create benchmark history directory
          mkdir -p benchmark-history
          
          # Copy current benchmarks to history
          for file in reports/benchmark-results-*/; do
            if [ -d "$file" ]; then
              benchmark_type=$(echo "$file" | sed 's/.*benchmark-results-\([^-]*\)-.*/\1/')
              cp "$file"/*.txt "benchmark-history/${benchmark_type}_$(date +%Y%m%d_%H%M%S)_${{ github.sha }}.txt" 2>/dev/null || true
            fi
          done

      - name: Generate trending report
        run: |
          echo "# Performance Trending Report" > trending-report.md
          echo "" >> trending-report.md
          echo "**Date**: $(date -u)" >> trending-report.md
          echo "**Commit**: ${{ github.sha }}" >> trending-report.md
          echo "" >> trending-report.md
          
          # List recent benchmark files
          echo "## Recent Benchmarks" >> trending-report.md
          ls -lt benchmark-history/ | head -10 >> trending-report.md

      - name: Upload benchmark history
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-history-${{ github.sha }}
          path: benchmark-history/
          retention-days: 90

  stress-test:
    name: Stress Testing
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.benchmark_time != '')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: |
          go mod download
          sudo apt-get update
          sudo apt-get install -y stress-ng htop

      - name: Run extended stress tests
        run: |
          echo "Running extended stress tests..."
          
          # Monitor system resources during stress test
          htop -d 1 > system-stats.txt &
          HTOP_PID=$!
          
          # Run stress test with high memory and CPU load
          timeout 300 stress-ng --cpu 2 --vm 1 --vm-bytes 1G --timeout 60s &
          STRESS_PID=$!
          
          # Run benchmarks under stress
          go test -bench=BenchmarkCacheConcurrency -benchmem -benchtime=60s ./test/benchmark/ -run=^$ > stress-benchmark-results.txt
          
          # Cleanup
          kill $HTOP_PID $STRESS_PID 2>/dev/null || true
          
          echo "Stress test completed"

      - name: Upload stress test results
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results-${{ github.sha }}
          path: |
            stress-benchmark-results.txt
            system-stats.txt
          retention-days: 7