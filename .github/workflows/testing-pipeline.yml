# 🧪 ProxyND Testing Pipeline
# 4-Layer Test Architecture (Hexagonal + Clean Architecture)
name: Testing Pipeline

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'tests/**'
      - 'Makefile.test.mk'
      - '.github/workflows/testing-pipeline.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'tests/**'
      - 'Makefile.test.mk'
      - '.github/workflows/testing-pipeline.yml'

env:
  GO_VERSION: '1.24'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

concurrency:
  group: testing-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 🚀 Stage 1: Quick Feedback (Unit Tests + Lint)
  quick-feedback:
    name: Quick Feedback (Unit + Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cache-key: ${{ steps.cache-key.outputs.key }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate cache key
        id: cache-key
        run: echo "key=go-${{ hashFiles('go.mod', 'go.sum') }}-${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: make test-deps

      - name: Run linting
        run: make lint

      - name: Run unit tests (Domain/Usecase layers)
        run: make test-unit

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: |
            reports/coverage/unit.*
            reports/test-results/unit.*
          retention-days: 7

  # 🤝 Stage 2: Contract Tests (Ports layer)
  contract-tests:
    name: Contract Tests (Ports Layer)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quick-feedback
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: make test-deps

      - name: Run contract tests
        run: make test-contract

      - name: Generate contract coverage
        run: make test-coverage-contract

      - name: Upload contract test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contract-test-results
          path: |
            reports/coverage/contract.*
            reports/test-results/contract.*
          retention-days: 7

  # 🔗 Stage 3: Integration Tests (Adapters layer)
  integration-tests:
    name: Integration Tests (${{ matrix.package-manager }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: contract-tests
    strategy:
      fail-fast: false
      matrix:
        package-manager: [npm, pip, apt, docker, maven, yum, apk]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: make test-deps

      - name: Setup test environment
        run: make test-setup

      - name: Run ${{ matrix.package-manager }} integration tests
        run: make test-${{ matrix.package-manager }}

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-${{ matrix.package-manager }}
          path: |
            reports/coverage/${{ matrix.package-manager }}.*
            reports/test-results/${{ matrix.package-manager }}.*
          retention-days: 7

      - name: Cleanup test environment
        if: always()
        run: make test-teardown

  # 🔗 Stage 3b: Combined Integration Tests
  integration-combined:
    name: Combined Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: contract-tests
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install dependencies
        run: make test-deps

      - name: Setup test environment
        run: make test-setup

      - name: Run integration tests
        run: make test-integration

      - name: Generate integration coverage
        run: make test-coverage-integration

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results-combined
          path: |
            reports/coverage/integration.*
            reports/test-results/integration.*
          retention-days: 7

      - name: Cleanup test environment
        if: always()
        run: make test-teardown

  # 🌐 Stage 4: E2E Tests (Full system) - Only on main/develop
  e2e-tests:
    name: E2E Tests (Full System)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [integration-tests, integration-combined]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install dependencies
        run: make test-deps

      - name: Setup test environment
        run: make test-setup

      - name: Build test image
        run: docker build -t proxynd:e2e .

      - name: Run E2E tests
        run: make test-e2e

      - name: Upload E2E test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            reports/test-results/e2e.*
            logs/e2e.*
          retention-days: 7

      - name: Upload E2E logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-logs
          path: |
            logs/
            docker-compose.e2e.yml
          retention-days: 14

      - name: Cleanup test environment
        if: always()
        run: make test-teardown

  # 📊 Coverage Report Generation
  coverage-report:
    name: Generate Coverage Report
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [quick-feedback, contract-tests, integration-combined]
    if: always() && (needs.quick-feedback.result == 'success' || needs.contract-tests.result == 'success' || needs.integration-combined.result == 'success')
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download all test artifacts
        uses: actions/download-artifact@v5
        with:
          path: reports/

      - name: Install dependencies
        run: make test-deps

      - name: Generate combined coverage report
        run: make test-coverage-all

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          file: ./reports/coverage/combined.coverage
          flags: unittests,integration
          name: proxynd-coverage
          fail_ci_if_error: false

      - name: Upload final coverage report
        uses: actions/upload-artifact@v4
        with:
          name: final-coverage-report
          path: |
            reports/coverage/combined.*
            reports/coverage/*.html
          retention-days: 30

  # ✅ Test Summary
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [quick-feedback, contract-tests, integration-tests, integration-combined, e2e-tests]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "## 🧪 Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Test Layer | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.quick-feedback.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Contract Tests | ${{ needs.contract-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Combined Integration | ${{ needs.integration-combined.result == 'success' && '✅ Passed' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.e2e-tests.result == 'success' && '✅ Passed' || needs.e2e-tests.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY

          # Determine overall status
          if [[ "${{ needs.quick-feedback.result }}" == "success" &&
                "${{ needs.contract-tests.result }}" == "success" &&
                "${{ needs.integration-tests.result }}" == "success" &&
                "${{ needs.integration-combined.result }}" == "success" ]]; then
            echo "### ✅ All required tests passed!" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "### ❌ Some tests failed!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

  # 🚨 Failure Notification (Optional)
  notify-failure:
    name: Notify Test Failures
    runs-on: ubuntu-latest
    needs: [test-summary]
    if: failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - name: Notify failure
        run: |
          echo "Test failures detected on ${{ github.ref_name }} branch"
          echo "Please check the test results and fix any issues"
          # Add notification logic here (Slack, email, etc.)
