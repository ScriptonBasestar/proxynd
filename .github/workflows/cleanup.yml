name: Cleanup and Maintenance

on:
  schedule:
    - cron: '0 2 * * 0'  # 매주 일요일 2시
  workflow_dispatch:
    inputs:
      cleanup_type:
        description: 'Type of cleanup to perform'
        required: true
        type: choice
        options:
          - all
          - artifacts
          - cache
          - dependencies
        default: 'all'

env:
  GO_VERSION: '1.22'

permissions:
  contents: read
  actions: write  # 아티팩트 삭제를 위한 권한

jobs:
  cleanup-artifacts:
    name: Cleanup Build Artifacts
    runs-on: ubuntu-latest
    if: github.event.inputs.cleanup_type == 'all' || github.event.inputs.cleanup_type == 'artifacts' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Clean build artifacts
        run: |
          make clean-all || echo "Clean target not available"

      - name: Verify cleanup
        run: |
          if [ -f "proxynd" ] || [ -f "bin/proxynd" ] || [ -f "tmp/main" ]; then
            echo "❌ Build artifacts not cleaned properly"
            exit 1
          fi
          echo "✅ Cleanup verification passed"

      - name: Check for large files
        run: |
          echo "Checking for files larger than 10MB..."
          find . -type f -size +10M -not -path "./.git/*" || true

      - name: Report disk usage
        run: |
          echo "Disk usage after cleanup:"
          du -sh . || true
          echo "Largest directories:"
          du -sh */ 2>/dev/null | sort -hr | head -10 || true

  cleanup-github-artifacts:
    name: Cleanup GitHub Artifacts
    runs-on: ubuntu-latest
    if: github.event.inputs.cleanup_type == 'all' || github.event.inputs.cleanup_type == 'artifacts' || github.event_name == 'schedule'
    steps:
      - name: Delete old artifacts
        uses: actions/github-script@v7
        with:
          script: |
            const artifacts = await github.rest.actions.listArtifactsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - 30); // 30일 이전 아티팩트 삭제

            let deletedCount = 0;
            for (const artifact of artifacts.data.artifacts) {
              const createdAt = new Date(artifact.created_at);
              if (createdAt < cutoffDate) {
                try {
                  await github.rest.actions.deleteArtifact({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    artifact_id: artifact.id
                  });
                  console.log(`Deleted artifact: ${artifact.name} (${artifact.created_at})`);
                  deletedCount++;
                } catch (error) {
                  console.log(`Failed to delete artifact ${artifact.name}: ${error.message}`);
                }
              }
            }
            console.log(`Deleted ${deletedCount} old artifacts`);

  cleanup-cache:
    name: Cleanup Cache
    runs-on: ubuntu-latest
    if: github.event.inputs.cleanup_type == 'all' || github.event.inputs.cleanup_type == 'cache' || github.event_name == 'schedule'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cleanup Go module cache
        run: |
          go clean -modcache || echo "No module cache to clean"
          go clean -cache || echo "No build cache to clean"
          go clean -testcache || echo "No test cache to clean"

      - name: Clear GitHub Actions cache
        uses: actions/github-script@v7
        with:
          script: |
            const caches = await github.rest.actions.getActionsCacheList({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });

            const cutoffDate = new Date();
            cutoffDate.setDate(cutoffDate.getDate() - 7); // 7일 이전 캐시 삭제

            let deletedCount = 0;
            for (const cache of caches.data.actions_caches) {
              const createdAt = new Date(cache.created_at);
              if (createdAt < cutoffDate) {
                try {
                  await github.rest.actions.deleteActionsCacheById({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    cache_id: cache.id
                  });
                  console.log(`Deleted cache: ${cache.key} (${cache.created_at})`);
                  deletedCount++;
                } catch (error) {
                  console.log(`Failed to delete cache ${cache.key}: ${error.message}`);
                }
              }
            }
            console.log(`Deleted ${deletedCount} old caches`);

  update-dependencies:
    name: Update Dependencies
    runs-on: ubuntu-latest
    if: github.event.inputs.cleanup_type == 'all' || github.event.inputs.cleanup_type == 'dependencies' || github.event_name == 'schedule'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Update dependencies
        run: |
          go get -u ./...
          go mod tidy

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          go test -v ./... -short

      - name: Create Pull Request
        if: steps.changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update Go dependencies'
          title: 'chore: update Go dependencies'
          body: |
            ## 📦 Automated Dependency Updates

            This PR updates Go module dependencies to their latest versions.

            ### Changes
            - Updated go.mod and go.sum files
            - All tests have been run and passed

            ### Checklist
            - [ ] Review dependency changes
            - [ ] Check for breaking changes in updated packages
            - [ ] Verify all tests pass
            - [ ] Review security advisories for updated packages
          branch: dependency-update
          delete-branch: true
          labels: |
            dependencies
            automated

  security-cleanup:
    name: Security Cleanup
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run security vulnerability check
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Check for dependency vulnerabilities
        run: |
          go list -json -m all | docker run --rm -i sonatypecorp/nancy:latest sleuth

  cleanup-dependabot-branches:
    name: Cleanup Dependabot Branches
    runs-on: ubuntu-latest
    if: github.event.inputs.cleanup_type == 'all' || github.event_name == 'schedule'
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup GitHub CLI
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
          sudo apt update
          sudo apt install gh -y

      - name: Authenticate GitHub CLI
        run: echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Run Dependabot branch cleanup
        run: |
          chmod +x scripts/cleanup-dependabot-branches.sh
          ./scripts/cleanup-dependabot-branches.sh

  cleanup-report:
    name: Generate Cleanup Report
    runs-on: ubuntu-latest
    needs: [cleanup-artifacts, cleanup-github-artifacts, cleanup-cache, update-dependencies, security-cleanup, cleanup-dependabot-branches]
    if: always()
    steps:
      - name: Generate cleanup report
        run: |
          echo "# 🧹 Cleanup and Maintenance Report" > cleanup_report.md
          echo "" >> cleanup_report.md
          echo "Generated: $(date)" >> cleanup_report.md
          echo "" >> cleanup_report.md

          echo "## Job Results:" >> cleanup_report.md
          echo "- Cleanup Artifacts: ${{ needs.cleanup-artifacts.result }}" >> cleanup_report.md
          echo "- Cleanup GitHub Artifacts: ${{ needs.cleanup-github-artifacts.result }}" >> cleanup_report.md
          echo "- Cleanup Cache: ${{ needs.cleanup-cache.result }}" >> cleanup_report.md
          echo "- Update Dependencies: ${{ needs.update-dependencies.result }}" >> cleanup_report.md
          echo "- Security Cleanup: ${{ needs.security-cleanup.result }}" >> cleanup_report.md
          echo "" >> cleanup_report.md

          echo "## Summary:" >> cleanup_report.md
          echo "- Old artifacts and caches have been removed" >> cleanup_report.md
          echo "- Dependencies have been checked for updates" >> cleanup_report.md
          echo "- Security vulnerabilities have been scanned" >> cleanup_report.md
          echo "- Repository maintenance completed" >> cleanup_report.md

      - name: Upload cleanup report
        uses: actions/upload-artifact@v4
        with:
          name: cleanup-report
          path: cleanup_report.md

      - name: Comment on workflow completion
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "🧹 Repository cleanup and maintenance completed"
          echo "📋 Check the cleanup report for details"
