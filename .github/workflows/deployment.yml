          # kubectl rollout status deployment/proxynd -n development --timeout=300s
          
          echo "✅ Development deployment completed"

      - name: Run deployment tests
        if: github.event.inputs.skip_tests != 'true'
        run: |
          echo "🧪 Running deployment tests..."
          
          # Health check
          # curl -f https://dev.proxynd.example.com/health || exit 1
          
