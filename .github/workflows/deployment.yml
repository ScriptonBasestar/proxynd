    if: failure() && needs.determine-environment.outputs.should-deploy == 'true'
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: Automatic rollback
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          echo "🔄 Rolling back deployment in $ENVIRONMENT..."
          
          case "$ENVIRONMENT" in
