name: Deployment Pipeline

on:
  workflow_run:
    workflows: ["Enhanced CI Pipeline"]
    types:
      - completed
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - development
          - staging
          - production
      image_tag:
        description: 'Docker image tag to deploy'
        required: false
        type: string
      skip_tests:
        description: 'Skip deployment tests'
        required: false
        type: boolean
        default: false

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  determine-environment:
    name: Determine Deployment Environment
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.env.outputs.environment }}
      image-tag: ${{ steps.env.outputs.image-tag }}
      should-deploy: ${{ steps.env.outputs.should-deploy }}
    steps:
      - name: Determine environment and tag
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENVIRONMENT="${{ github.event.inputs.environment }}"
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
            SHOULD_DEPLOY="true"
          else
            # Auto-deployment based on branch
            case "${{ github.event.workflow_run.head_branch }}" in
              "develop")
                ENVIRONMENT="development"
                ;;
              "main"|"master")
                ENVIRONMENT="staging"
                ;;
              *)
                ENVIRONMENT="none"
                ;;
            esac
            
            IMAGE_TAG="${{ github.event.workflow_run.head_sha }}"
            
            # Only deploy if the workflow was successful
            if [ "${{ github.event.workflow_run.conclusion }}" = "success" ] && [ "$ENVIRONMENT" != "none" ]; then
              SHOULD_DEPLOY="true"
            else
              SHOULD_DEPLOY="false"
            fi
          fi
          
          # If no image tag specified, use commit SHA
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG="${{ github.sha }}"
          fi
          
          echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT
          echo "image-tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "should-deploy=$SHOULD_DEPLOY" >> $GITHUB_OUTPUT
          
          echo "Target environment: $ENVIRONMENT"
          echo "Image tag: $IMAGE_TAG"
          echo "Should deploy: $SHOULD_DEPLOY"

  pre-deployment-checks:
    name: Pre-deployment Checks
    runs-on: ubuntu-latest
    needs: determine-environment
    if: needs.determine-environment.outputs.should-deploy == 'true'
    environment: ${{ needs.determine-environment.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify Docker image exists
        run: |
          IMAGE_TAG="${{ needs.determine-environment.outputs.image-tag }}"
          IMAGE_URL="${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:$IMAGE_TAG"
          
          echo "Checking if image exists: $IMAGE_URL"
          
          # Try to pull the image to verify it exists
          if docker manifest inspect "$IMAGE_URL" >/dev/null 2>&1; then
            echo "✅ Docker image exists: $IMAGE_URL"
          else
            echo "❌ Docker image not found: $IMAGE_URL"
            exit 1
          fi

      - name: Check environment readiness
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          
          case "$ENVIRONMENT" in
            "development")
              echo "✅ Development environment ready"
              ;;
            "staging")
              echo "✅ Staging environment ready"
              # Additional staging checks could go here
              ;;
            "production")
              echo "🔒 Production deployment requires manual approval"
              # Additional production checks
              ;;
          esac

      - name: Validate configuration
        run: |
          ENVIRONMENT="${{ needs.determine-environment.outputs.environment }}"
          
          # Check if environment-specific configuration exists
          if [ -f "config/environments/$ENVIRONMENT.yaml" ]; then
            echo "✅ Environment configuration found"
          else
            echo "⚠️ No specific configuration for $ENVIRONMENT, using defaults"
          fi

  deploy-development:
    name: Deploy to Development
    runs-on: ubuntu-latest
    needs: [determine-environment, pre-deployment-checks]
    if: needs.determine-environment.outputs.environment == 'development'
    environment:
      name: development
      url: https://dev.proxynd.example.com
    steps:
      - name: Deploy to development
        run: |
          echo "🚀 Deploying to development environment..."
          IMAGE_TAG="${{ needs.determine-environment.outputs.image-tag }}"
          
          # Simulate deployment (replace with actual deployment commands)
