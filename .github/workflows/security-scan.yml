name: Security Scanning

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run comprehensive security scan daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan'
        required: true
        type: choice
        options:
          - all
          - code
          - dependencies
          - secrets
          - container
      severity_threshold:
        description: 'Minimum severity to report'
        required: false
        type: choice
        options:
          - low
          - medium
          - high
          - critical
        default: 'medium'

env:
  GO_VERSION: '1.22'

permissions:
  contents: read
  security-events: write
  id-token: write  # OIDC 지원

jobs:
  # Step Security Harden Runner
  security-hardening:
    name: Security Hardening
    runs-on: ubuntu-latest
    outputs:
      harden-runner-result: ${{ steps.harden_runner.outcome }}
    steps:
      - name: Harden Runner
        id: harden_runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
          allowed-endpoints: |
            api.github.com:443
            github.com:443
            uploads.github.com:443
            objects.githubusercontent.com:443
            registry-1.docker.io:443
            auth.docker.io:443
            production.cloudflare.docker.com:443
            index.docker.io:443
            dl.google.com:443
            storage.googleapis.com:443
            proxy.golang.org:443
            sum.golang.org:443

  # CodeQL 분석
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    needs: security-hardening
    strategy:
      fail-fast: false
      matrix:
        language: [ 'go' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # Go 보안 스캔 (Gosec)
  gosec:
    name: Go Security Scanner (Gosec)
    runs-on: ubuntu-latest
    needs: security-hardening
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'code' || github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Gosec Security Scanner
        uses: securecodewarrior/github-action-gosec@master
        with:
          args: '-fmt sarif -out gosec-results.sarif ./...'

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec-results.sarif

  # 의존성 취약점 스캔
  dependency-scan:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    needs: security-hardening
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'dependencies' || github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Nancy dependency scan
        run: |
          go list -json -deps ./... | docker run --rm -i sonatypecorp/nancy:latest sleuth

      - name: OSV Scanner
        uses: google/osv-scanner-action@v1
        with:
          scan-args: |-
            -r
            --skip-git
            .

  # 비밀 정보 스캔
  secret-scan:
    name: Secret Detection
    runs-on: ubuntu-latest
    needs: security-hardening
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'secrets' || github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified

      - name: GitLeaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # 컨테이너 보안 스캔
  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    needs: security-hardening
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'container' || github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image for scanning
        run: |
          docker build -t proxynd:scan -f Dockerfile.multiarch .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'proxynd:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@v6
        with:
          image: 'proxynd:scan'
          severity-cutoff: medium

  # SBOM 생성
  sbom-generation:
    name: SBOM Generation
    runs-on: ubuntu-latest
    needs: security-hardening
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: ./
          format: spdx-json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: ./sbom.*

  # 라이센스 컴플라이언스
  license-compliance:
    name: License Compliance
    runs-on: ubuntu-latest
    needs: security-hardening
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Check Go module licenses
        run: |
          go install github.com/google/go-licenses@latest
          go-licenses check ./...

      - name: Generate license report
        run: |
          go-licenses report ./... > license-report.txt

      - name: Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: license-report.txt

  # 보안 스코어카드
  scorecard:
    name: OSSF Scorecard
    runs-on: ubuntu-latest
    needs: security-hardening
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Run OSSF Scorecard
        uses: ossf/scorecard-action@v2.4.2
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload SARIF results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  # 보안 알림
  security-notification:
    name: Security Notification
    runs-on: ubuntu-latest
    needs: [codeql, gosec, dependency-scan, secret-scan, container-scan]
    if: always() && (github.event_name == 'schedule' || failure())
    steps:
      - name: Generate security report
        run: |
          echo "## 🔒 Security Scan Results" > security-report.md
          echo "" >> security-report.md
          echo "### Job Results:" >> security-report.md
          echo "- CodeQL: ${{ needs.codeql.result }}" >> security-report.md
          echo "- Gosec: ${{ needs.gosec.result }}" >> security-report.md
          echo "- Dependency Scan: ${{ needs.dependency-scan.result }}" >> security-report.md
          echo "- Secret Scan: ${{ needs.secret-scan.result }}" >> security-report.md
          echo "- Container Scan: ${{ needs.container-scan.result }}" >> security-report.md
          echo "" >> security-report.md
          echo "### Next Steps:" >> security-report.md
          echo "1. Review security findings in the Security tab" >> security-report.md
          echo "2. Address any critical or high severity issues" >> security-report.md
          echo "3. Update dependencies with security patches" >> security-report.md

      - name: Upload security report
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: security-report.md

      - name: Comment on PR (if applicable)
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            const comment = `## ⚠️ Security Scan Issues Detected

            Some security scans have reported issues. Please review the [Security tab](https://github.com/${{ github.repository }}/security) and address any critical findings before merging.

            ### Failed Scans:
            - CodeQL: ${{ needs.codeql.result }}
            - Gosec: ${{ needs.gosec.result }}
            - Dependency Scan: ${{ needs.dependency-scan.result }}
            - Secret Scan: ${{ needs.secret-scan.result }}
            - Container Scan: ${{ needs.container-scan.result }}

            ---
            <sub>Generated by ProxyND Security Pipeline</sub>`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
