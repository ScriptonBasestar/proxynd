name: Security Scanning

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run comprehensive security scan daily at 3 AM UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Type of security scan'
        required: true
        type: choice
        options:
          - all
          - code
          - dependencies
          - secrets
          - container
      severity_threshold:
        description: 'Minimum severity to report'
        required: false
        type: choice
        options:
          - low
          - medium
          - high
          - critical
        default: 'medium'

env:
  GO_VERSION: '1.22'

jobs:
  code-security-scan:
    name: Code Security Analysis
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'code' || github.event_name != 'workflow_dispatch'
    permissions:
      security-events: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Gosec
        run: |
          go install github.com/securecodewarrior/gosec/v2/cmd/gosec@latest

      - name: Run Gosec Security Scanner
        run: |
          # Run gosec with comprehensive rules
          gosec -fmt sarif -out gosec-results.sarif -include=G* ./...
          gosec -fmt json -out gosec-results.json -include=G* ./...
          gosec -fmt text -out gosec-results.txt -include=G* ./...

      - name: Upload Gosec SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec-results.sarif

      - name: Install StaticCheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Run StaticCheck
        run: |
          staticcheck -f sarif ./... > staticcheck-results.sarif
          staticcheck ./... > staticcheck-results.txt

      - name: Upload StaticCheck SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: staticcheck-results.sarif

      - name: Install govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: |
          govulncheck -json ./... > govulncheck-results.json
          govulncheck ./... > govulncheck-results.txt

      - name: Upload security scan results
        uses: actions/upload-artifact@v4
        with:
          name: code-security-results
          path: |
            gosec-results.*
            staticcheck-results.*
            govulncheck-results.*
          retention-days: 30

  dependency-security-scan:
    name: Dependency Security Analysis
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'dependencies' || github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install Nancy
        run: |
          go install github.com/sonatypecommunity/nancy@latest

      - name: Run Nancy vulnerability scanner
        run: |
          go list -json -deps ./... | nancy sleuth --loud --output-format=json > nancy-results.json
          go list -json -deps ./... | nancy sleuth --loud > nancy-results.txt

      - name: Install OSV Scanner
        run: |
          curl -L -o osv-scanner https://github.com/google/osv-scanner/releases/latest/download/osv-scanner_linux_amd64
          chmod +x osv-scanner

      - name: Run OSV Scanner
        run: |
          ./osv-scanner --format json --output osv-results.json .
          ./osv-scanner --output osv-results.txt .

      - name: Check for high severity vulnerabilities
        run: |
          # Parse Nancy results for high/critical vulnerabilities
          if [ -f "nancy-results.json" ]; then
            HIGH_VULNS=$(jq '[.[] | select(.vulnerability.cvssScore >= 7.0)] | length' nancy-results.json)
            echo "High severity vulnerabilities found: $HIGH_VULNS"
            if [ "$HIGH_VULNS" -gt 0 ]; then
              echo "❌ High severity vulnerabilities detected!"
              jq '[.[] | select(.vulnerability.cvssScore >= 7.0)]' nancy-results.json
              if [ "${{ github.event.inputs.severity_threshold }}" = "high" ] || [ "${{ github.event.inputs.severity_threshold }}" = "critical" ]; then
                exit 1
              fi
            fi
          fi

      - name: Upload dependency scan results
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-results
          path: |
            nancy-results.*
            osv-results.*
          retention-days: 30

  secret-scanning:
    name: Secret Detection
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'secrets' || github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          curl -sSfL https://raw.githubusercontent.com/trufflesecurity/trufflehog/main/scripts/install.sh | sh -s -- -b /usr/local/bin

      - name: Run TruffleHog secret scanner
        run: |
          trufflehog git file://. --json --only-verified > trufflehog-verified.json
          trufflehog git file://. --json > trufflehog-all.json
          trufflehog git file://. > trufflehog-results.txt

      - name: Install git-secrets
        run: |
          git clone https://github.com/awslabs/git-secrets.git
          cd git-secrets && make install

      - name: Run git-secrets
        run: |
          git secrets --register-aws
          git secrets --install
          git secrets --scan > git-secrets-results.txt || echo "Git secrets scan completed with findings"

      - name: Install detect-secrets
        run: |
          pip install detect-secrets

      - name: Run detect-secrets
        run: |
          detect-secrets scan --all-files > detect-secrets-baseline.json
          detect-secrets audit detect-secrets-baseline.json --report > detect-secrets-results.txt

      - name: Check for verified secrets
        run: |
          if [ -f "trufflehog-verified.json" ]; then
            VERIFIED_SECRETS=$(jq length trufflehog-verified.json)
            echo "Verified secrets found: $VERIFIED_SECRETS"
            if [ "$VERIFIED_SECRETS" -gt 0 ]; then
              echo "❌ Verified secrets detected!"
              jq . trufflehog-verified.json
              exit 1
            fi
          fi

      - name: Upload secret scan results
        uses: actions/upload-artifact@v4
        with:
          name: secret-scan-results
          path: |
            trufflehog-*
            git-secrets-results.txt
            detect-secrets-*
          retention-days: 30

  container-security-scan:
    name: Container Security Analysis
    runs-on: ubuntu-latest
    if: github.event.inputs.scan_type == 'all' || github.event.inputs.scan_type == 'container' || github.event_name != 'workflow_dispatch'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for scanning
        run: |
          docker build -t proxynd-security-scan:latest .

      - name: Run Trivy container scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'proxynd-security-scan:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy SARIF results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy with JSON output
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'proxynd-security-scan:latest'
          format: 'json'
          output: 'trivy-results.json'

      - name: Run Trivy with table output
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'proxynd-security-scan:latest'
          format: 'table'
          output: 'trivy-results.txt'

      - name: Install Grype
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Run Grype container scanner
        run: |
          grype proxynd-security-scan:latest -o json > grype-results.json
          grype proxynd-security-scan:latest > grype-results.txt

      - name: Install Syft for SBOM generation
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM
        run: |
          syft proxynd-security-scan:latest -o json > sbom.json
          syft proxynd-security-scan:latest -o spdx-json > sbom-spdx.json
          syft proxynd-security-scan:latest > sbom.txt

      - name: Check critical vulnerabilities
        run: |
          if [ -f "trivy-results.json" ]; then
            CRITICAL_VULNS=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "CRITICAL")] | length' trivy-results.json)
            HIGH_VULNS=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity == "HIGH")] | length' trivy-results.json)
            echo "Critical vulnerabilities: $CRITICAL_VULNS"
            echo "High vulnerabilities: $HIGH_VULNS"
            
            if [ "$CRITICAL_VULNS" -gt 0 ]; then
              echo "❌ Critical vulnerabilities found in container!"
              if [ "${{ github.event.inputs.severity_threshold }}" = "critical" ]; then
                exit 1
              fi
            fi
          fi

      - name: Upload container scan results
        uses: actions/upload-artifact@v4
        with:
          name: container-security-results
          path: |
            trivy-results.*
            grype-results.*
            sbom*
          retention-days: 30

  security-compliance-check:
    name: Security Compliance Check
    runs-on: ubuntu-latest
    needs: [code-security-scan, dependency-security-scan, secret-scanning, container-security-scan]
    if: always()
    steps:
      - name: Download all security scan results
        uses: actions/download-artifact@v4
        with:
          path: security-results/

      - name: Security compliance assessment
        run: |
          echo "# Security Compliance Report" > security-report.md
          echo "" >> security-report.md
          echo "**Scan Date**: $(date -u)" >> security-report.md
          echo "**Repository**: ${{ github.repository }}" >> security-report.md
          echo "**Branch**: ${{ github.ref_name }}" >> security-report.md
          echo "**Commit**: ${{ github.sha }}" >> security-report.md
          echo "" >> security-report.md
          
          # Check scan results
          echo "## Scan Results Summary" >> security-report.md
          echo "- Code Security: ${{ needs.code-security-scan.result }}" >> security-report.md
          echo "- Dependency Security: ${{ needs.dependency-security-scan.result }}" >> security-report.md
          echo "- Secret Scanning: ${{ needs.secret-scanning.result }}" >> security-report.md
          echo "- Container Security: ${{ needs.container-security-scan.result }}" >> security-report.md
          echo "" >> security-report.md
          
          # Overall compliance status
          if [[ "${{ needs.code-security-scan.result }}" == "success" && 
                "${{ needs.dependency-security-scan.result }}" == "success" && 
                "${{ needs.secret-scanning.result }}" == "success" && 
                "${{ needs.container-security-scan.result }}" == "success" ]]; then
            echo "## ✅ Security Compliance: PASSED" >> security-report.md
            echo "All security scans completed successfully." >> security-report.md
            echo "COMPLIANCE_STATUS=PASSED" >> $GITHUB_ENV
          else
            echo "## ❌ Security Compliance: FAILED" >> security-report.md
            echo "One or more security scans failed. Please review the detailed results." >> security-report.md
            echo "COMPLIANCE_STATUS=FAILED" >> $GITHUB_ENV
          fi

      - name: Upload security compliance report
        uses: actions/upload-artifact@v4
        with:
          name: security-compliance-report
          path: security-report.md
          retention-days: 90

      - name: Comment on PR with security results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Security scan results not available.';
            
            try {
              body = fs.readFileSync('security-report.md', 'utf8');
            } catch (error) {
              console.log('Security report file not found:', error);
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🔒 Security Scan Results\n\n${body}`
            });

      - name: Fail if security compliance failed
        if: env.COMPLIANCE_STATUS == 'FAILED'
        run: |
          echo "❌ Security compliance check failed!"
          echo "Please review the security scan results and address any findings."
          exit 1

  notify-security-team:
    name: Security Team Notification
    runs-on: ubuntu-latest
    needs: [security-compliance-check]
    if: failure() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Notify security team
        run: |
          echo "🚨 Security scan failed on main branch!"
          echo "Repository: ${{ github.repository }}"
          echo "Commit: ${{ github.sha }}"
          echo "View results: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          # Send notification to security team
          # This could be integrated with Slack, email, or other notification systems