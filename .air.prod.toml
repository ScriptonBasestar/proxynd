# air.toml
root = "."
testdata_dir = "testdata"
tmp_dir = "tmp"

[build]
  args_bin = []
  bin = "./bin/app"
  cmd = "go build -o ./bin/app main.go"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "testdata", "ent/generated", "docs"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html"]
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = false

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false
  level = "info"

[misc]
  clean_on_exit = false

[screen]
  clear_on_rebuild = false

# run both REST and gRPC servers
[run]
  cmd = "bash"
  args = ["-c", "./bin/familybook-rest & ./bin/familybook-grpc"]
  delay = 1000
  stop_on_error = false
  log = "runner-errors.log"

[watch]
include = ["**/*.go", "**/*.html", "**/*.yaml"]
exclude = ["tmp", "vendor", "bin"]
