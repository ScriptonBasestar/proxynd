# 통합 테스트용 설정
server:
  port: 8080
  host: localhost

proxy:
  npm:
    enabled: true
    upstream: https://registry.npmjs.org
  pip:
    enabled: true
    upstream: https://pypi.org
  apt:
    enabled: true
    upstream: http://archive.ubuntu.com
  docker:
    enabled: true
    upstream: https://registry-1.docker.io

cache:
  backend: filesystem
  filesystem:
    path: /tmp/proxynd-test-cache
  options:
    default_ttl: 3600
    max_size: 1073741824  # 1GB

auth:
  enabled: false
  users: []

security:
  hash_verification: false
  ip_filter:
    enabled: false

logging:
  level: info
  format: text
  access_log:
    enabled: true
    file: /tmp/proxynd-test-access.log