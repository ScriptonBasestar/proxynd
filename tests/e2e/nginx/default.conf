# 업스트림 서버 시뮬레이션용 Nginx 설정

server {
    listen 80;
    server_name localhost;

    # 로깅 설정
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # 기본 위치
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ =404;

        # CORS 헤더 추가
        add_header Access-Control-Allow-Origin *;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    }

    # NPM 레지스트리 시뮬레이션
    location /npm/ {
        alias /usr/share/nginx/html/npm/;
        try_files $uri $uri/ @npm_proxy;

        # NPM 특화 헤더
        add_header Content-Type application/json;
        add_header X-Registry-Type npm;
    }

    # PyPI 레지스트리 시뮬레이션
    location /pip/ {
        alias /usr/share/nginx/html/pip/;
        try_files $uri $uri/ @pip_proxy;

        # PyPI 특화 헤더
        add_header Content-Type text/html;
        add_header X-Registry-Type pip;
    }

    # APT 레지스트리 시뮬레이션
    location /apt/ {
        alias /usr/share/nginx/html/apt/;
        try_files $uri $uri/ @apt_proxy;

        # APT 특화 헤더
        add_header X-Registry-Type apt;
    }

    # Docker 레지스트리 시뮬레이션
    location /docker/ {
        alias /usr/share/nginx/html/docker/;
        try_files $uri $uri/ @docker_proxy;

        # Docker 특화 헤더
        add_header Content-Type application/json;
        add_header X-Registry-Type docker;
        add_header Docker-Content-Digest sha256:dummy;
    }

    # 폴백 프록시 설정들
    location @npm_proxy {
        return 200 '{"name":"test-package","version":"1.0.0","description":"Test package for e2e testing"}';
        add_header Content-Type application/json;
    }

    location @pip_proxy {
        return 200 '<html><body><h1>PyPI Test Package</h1><a href="test-package-1.0.0.tar.gz">test-package-1.0.0.tar.gz</a></body></html>';
        add_header Content-Type text/html;
    }

    location @apt_proxy {
        return 200 'Package: test-package\nVersion: 1.0.0\nArchitecture: amd64\nDescription: Test package for e2e testing\n';
        add_header Content-Type text/plain;
    }

    location @docker_proxy {
        return 200 '{"schemaVersion":2,"mediaType":"application/vnd.docker.distribution.manifest.v2+json","config":{"mediaType":"application/vnd.docker.container.image.v1+json","size":1234,"digest":"sha256:dummy"}}';
        add_header Content-Type application/vnd.docker.distribution.manifest.v2+json;
    }

    # 헬스체크
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
