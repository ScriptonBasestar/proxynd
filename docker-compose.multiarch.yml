version: '3.8'

services:
  proxynd:
    image: ${DOCKER_REGISTRY:-scriptonbasestar}/proxynd:${VERSION:-latest}
    container_name: proxynd-multiarch
    platform: ${PLATFORM:-linux/amd64}  # 테스트할 플랫폼 지정
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - CONFIG_DIR=/config
      - STORAGE_DIR=/storage
      - LOG_LEVEL=info
      - LOG_FORMAT=json
    volumes:
      - ./sample-conf:/config:ro
      - proxynd-storage:/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  proxynd-storage:
    driver: local