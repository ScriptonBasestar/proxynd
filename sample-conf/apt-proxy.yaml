# ProxyND APT Proxy Configuration
# This file configures APT (Debian/Ubuntu) package proxying

# Storage path for APT packages (relative to storage_dir)
# This is where cached .deb files and metadata will be stored
path: "apt"

# Enable caching for APT packages
# When true, packages are stored locally and served from cache on subsequent requests
use_cache: true

# Enable user-specific caching (experimental)
# When true, maintains separate caches per authenticated user
user_cache: false

# Proxy configurations by distribution/architecture
# Format: distribution_architecture -> list of upstream mirrors
proxies:
  # Ubuntu 22.04 LTS (Jammy) - amd64
  ubuntu_jammy_amd64:
    - name: "Ubuntu Official Mirror"
      url: "http://archive.ubuntu.com/ubuntu"
    - name: "Ubuntu Mirror - US"
      url: "http://us.archive.ubuntu.com/ubuntu"
    - name: "Ubuntu Mirror - UK"
      url: "http://gb.archive.ubuntu.com/ubuntu"
  
  # Ubuntu 22.04 LTS (Jammy) - arm64
  ubuntu_jammy_arm64:
    - name: "Ubuntu ARM64 Official"
      url: "http://ports.ubuntu.com/ubuntu-ports"
  
  # Ubuntu 20.04 LTS (Focal) - amd64
  ubuntu_focal_amd64:
    - name: "Ubuntu Official Mirror"
      url: "http://archive.ubuntu.com/ubuntu"
    - name: "Ubuntu Mirror - US"
      url: "http://us.archive.ubuntu.com/ubuntu"
  
  # Ubuntu 20.04 LTS (Focal) - arm64
  ubuntu_focal_arm64:
    - name: "Ubuntu ARM64 Official"
      url: "http://ports.ubuntu.com/ubuntu-ports"
  
  # Debian 12 (Bookworm) - amd64
  debian_bookworm_amd64:
    - name: "Debian Official Mirror"
      url: "http://deb.debian.org/debian"
    - name: "Debian CDN"
      url: "http://cdn-fastly.deb.debian.org/debian"
    - name: "Debian Mirror - US"
      url: "http://ftp.us.debian.org/debian"
  
  # Debian 12 (Bookworm) - arm64
  debian_bookworm_arm64:
    - name: "Debian Official Mirror"
      url: "http://deb.debian.org/debian"
    - name: "Debian CDN"
      url: "http://cdn-fastly.deb.debian.org/debian"
  
  # Debian 11 (Bullseye) - amd64
  debian_bullseye_amd64:
    - name: "Debian Official Mirror"
      url: "http://deb.debian.org/debian"
    - name: "Debian CDN"
      url: "http://cdn-fastly.deb.debian.org/debian"
  
  # Debian Security Updates
  debian_security:
    - name: "Debian Security"
      url: "http://security.debian.org/debian-security"
    - name: "Debian Security CDN"
      url: "http://cdn-fastly.deb.debian.org/debian-security"
  
  # Ubuntu Security Updates
  ubuntu_security:
    - name: "Ubuntu Security"
      url: "http://security.ubuntu.com/ubuntu"
  
  # Custom/Private Repository Example
  # custom_internal:
  #   - name: "Internal APT Repository"
  #     url: "http://apt.internal.company.com/debian"
  
  # Third-party repositories
  # docker_ce:
  #   - name: "Docker CE Official"
  #     url: "https://download.docker.com/linux/ubuntu"
  
  # kubernetes:
  #   - name: "Kubernetes Official"
  #     url: "https://apt.kubernetes.io"

