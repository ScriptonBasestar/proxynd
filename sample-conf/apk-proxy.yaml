# APK 프록시 설정
# Alpine Linux의 APK 패키지 매니저를 위한 프록시 설정

# 캐시 저장 경로 (STORAGE_DIR 기준 상대 경로)
path: proxy/apk

# 캐시 사용 여부
use_cache: true

# 업스트림 프록시 서버 목록
proxies:
  # Alpine 공식 메인 저장소
  - name: alpine-official
    url: https://dl-cdn.alpinelinux.org/alpine
  
  # 카카오 미러 (한국)
  - name: kakao
    url: https://mirror.kakao.com/alpine
  
  # 네이버 미러 (한국)
  - name: naver
    url: https://mirror.navercorp.com/alpine
  
  # 글로벌 미러들
  - name: fastly
    url: https://alpine.global.ssl.fastly.net/alpine
  
  - name: dotsrc
    url: https://mirrors.dotsrc.org/alpine
  
  - name: tuna-tsinghua
    url: https://mirrors.tuna.tsinghua.edu.cn/alpine

# APK 서명 검증 설정
verification:
  # 서명 검증 활성화 여부
  enabled: false
  
  # 신뢰할 수 있는 공개키 디렉토리
  # Alpine Linux 공식 키들이 저장된 디렉토리 경로
  key_directory: "/etc/apk/keys"
  
  # 서명 검증 실패 시 요청 차단 여부
  # true: 서명이 유효하지 않은 패키지는 차단
  # false: 경고만 하고 계속 진행
  fail_on_invalid: false
  
  # 검증된 패키지만 캐시 여부
  # true: 서명이 검증된 패키지만 캐시에 저장
  # false: 모든 패키지를 캐시에 저장
  cache_validated: false