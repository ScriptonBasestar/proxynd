# ProxyND Global Configuration
# This file contains global settings that apply to all proxy types.
# For proxy-specific settings, see the individual proxy configuration files.

# =============================================================================
# Storage Configuration
# =============================================================================
# Base directory for all storage (caches, mirrors, etc.)
# If not set, uses STORAGE_DIR environment variable
# storage_dir: /var/lib/proxynd

# Configuration directory
# If not set, uses CONFIG_DIR environment variable
# config_dir: /etc/proxynd

# Cache directory (defaults to {storage_dir}/cache if not set)
# cache_dir: /var/lib/proxynd/cache

# Maximum cache size in bytes (0 = unlimited)
# max_cache_size: 107374182400  # 100GB

# =============================================================================
# Cache Configuration
# =============================================================================
cache:
  # Global default TTL in seconds (0 = no caching)
  # Range: 0-604800 (up to 7 days)
  ttl: "1h"  # 1 hour

  # HTTP Cache Headers Support
  # When enabled, respects Cache-Control and Expires headers from upstream
  use_cache_headers: true

  # Limits for cache headers (prevents excessive caching)
  max_cache_header_ttl: 86400  # Maximum 24 hours
  min_cache_header_ttl: 300    # Minimum 5 minutes

  # Stale-While-Revalidate Support
  # Serves stale content while fetching fresh content in background
  stale_while_revalidate: true
  stale_max_age: 3600  # Maximum time to serve stale content (1 hour)

  # Package Type Specific TTLs (seconds)
  # These override the global TTL for specific package types
  package_ttls:
    apt: 3600      # Debian/Ubuntu packages
    npm: 1800      # Node.js packages (more frequent updates)
    pip: 2400      # Python packages
    docker: 7200   # Docker images (larger, less frequent updates)
    maven: 5400    # Java artifacts
    yum: 3600      # RedHat/CentOS packages
    apk: 1800      # Alpine Linux packages
    cargo: 3600    # Rust crates
    go: 1800       # Go modules
    helm: 3600     # Kubernetes Helm charts
    vagrant: 7200  # Vagrant boxes
    github: 900    # GitHub releases

  # Pattern-based TTL Overrides
  # Patterns support wildcards: *, prefix-*, *-suffix, *substring*
  pattern_ttls:
    "*-SNAPSHOT": 300        # Maven SNAPSHOT versions (5 min)
    "*-SNAPSHOT.jar": 300    # Maven SNAPSHOT JARs
    "*-dev": 600            # Development versions (10 min)
    "*-alpha": 900          # Alpha versions (15 min)
    "*-beta": 1200          # Beta versions (20 min)
    "*-rc": 1800            # Release candidates (30 min)
    "*-RC*": 1800           # Alternative RC format
    "test-*": 300           # Test packages (5 min)
    "*debug*": 450          # Debug builds (7.5 min)
    "*experimental*": 180   # Experimental versions (3 min)
    "*.sha1": 86400         # Checksums (24 hours)
    "*.md5": 86400          # MD5 checksums
    "*.asc": 86400          # GPG signatures
    "*-latest": 600         # Latest tags (10 min)
    "nightly-*": 300        # Nightly builds (5 min)

  # Metadata File TTLs
  # Critical metadata files that change frequently
  metadata_ttls:
    # APT/Debian
    "Packages": 600          # Package lists (10 min)
    "Packages.gz": 600       # Compressed package lists
    "Packages.bz2": 600      # Bzip2 compressed
    "Packages.xz": 600       # XZ compressed
    "Release": 900           # Release files (15 min)
    "Release.gpg": 900       # Signed release
    "InRelease": 900         # Inline signed release
    "Sources": 600           # Source package lists
    "Sources.gz": 600        # Compressed sources

    # YUM/RPM
    "repomd.xml": 300        # Repository metadata (5 min)
    "primary.xml": 600       # Primary metadata
    "primary.xml.gz": 600    # Compressed primary
    "filelists.xml": 1800    # File lists (30 min)
    "filelists.xml.gz": 1800 # Compressed filelists
    "other.xml": 1800        # Other metadata
    "other.xml.gz": 1800     # Compressed other

    # NPM
    "package.json": 300      # Package metadata (5 min)
    "npm-shrinkwrap.json": 600  # Lock files (10 min)

    # Maven
    "maven-metadata.xml": 600     # Repository metadata (10 min)
    "maven-metadata.xml.sha1": 3600  # Checksums (1 hour)
    "maven-metadata.xml.md5": 3600   # MD5 checksums

    # Docker
    "manifest.json": 600     # Image manifests (10 min)
    "_catalog": 300          # Registry catalog (5 min)

    # Alpine APK
    "APKINDEX.tar.gz": 450   # Package index (7.5 min)

    # Helm
    "index.yaml": 900        # Chart repository index (15 min)

    # Python
    "simple": 300            # PyPI simple index (5 min)

# =============================================================================
# Authentication Configuration
# =============================================================================
authentication:
  # 전체 인증 시스템 활성화/비활성화 (기본값: true)
  # 개발 환경에서는 false로 설정하여 모든 인증 비활성화 가능
  enabled: true

  # Basic Authentication
  # Simple username/password authentication
  basic_auth:
    # Basic Auth 개별 활성화/비활성화 (기본값: true)
    enabled: true

    # Realm shown in authentication prompts
    realm: "ProxyND Restricted Area"

    # User credentials (username: password)
    # IMPORTANT: Use strong passwords in production!
    # Consider using environment variables or external auth
    users:
      # admin: "$2a$10$..."  # Use bcrypt hashed passwords in production
      admin: "changeme"       # Example only - change this!
      developer: "devpass"    # Example only - change this!
      readonly: "viewer"      # Example only - change this!

  # OAuth2 Configuration (see oauth2.yaml for detailed example)
  # oauth2:
  #   enabled: true
  #   config_file: oauth2.yaml

# =============================================================================
# Proxy Settings (Optional)
# =============================================================================
# Configure if ProxyND needs to use an upstream proxy
# proxy:
#   # HTTP proxy for non-HTTPS requests
#   http: "http://corporate-proxy.example.com:3128"
#
#   # HTTPS proxy for HTTPS requests
#   https: "http://corporate-proxy.example.com:3128"
#
#   # Comma-separated list of hosts to bypass proxy
#   no_proxy: "localhost,127.0.0.1,internal.domain.com"
#
#   # Proxy authentication (if required)
#   username: "proxy_user"
#   password: "proxy_pass"

# =============================================================================
# Server Configuration
# =============================================================================
# server:
#   # Server port (default: 8080, can be overridden by SERVER_PORT env var)
#   port: 8080
#
#   # Bind address (default: 0.0.0.0)
#   host: "0.0.0.0"
#
#   # Request timeout in seconds
#   timeout: 300
#
#   # Maximum request body size
#   max_body_size: "1GB"

