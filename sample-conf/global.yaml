#proxy:
#  http: 192.168.11.99:3128
#  https: 192.168.11.99:3129

cache:
  # 전역 기본 TTL (초)
  ttl: 3600
  
  # HTTP 캐시 헤더 기반 동적 TTL 사용 여부
  use_cache_headers: true
  
  # 캐시 헤더 기반 TTL 제한값 (초)
  max_cache_header_ttl: 86400  # 최대 24시간
  min_cache_header_ttl: 300    # 최소 5분
  
  # stale-while-revalidate 설정
  stale_while_revalidate: true # 만료된 캐시를 서빙하며 백그라운드에서 갱신
  stale_max_age: 3600         # stale 캐시 최대 서빙 시간 (초)
  
  # 패키지 타입별 기본 TTL 설정 (초)
  # 설정하지 않으면 내장 기본값 사용
  package_ttls:
    apt: 3600     # APT 패키지 (1시간)
    npm: 1800     # NPM 패키지 (30분)
    pip: 2400     # PIP 패키지 (40분)
    docker: 7200  # Docker 이미지 (2시간)
    maven: 5400   # Maven 아티팩트 (1.5시간)
    yum: 3600     # YUM 패키지 (1시간)
    apk: 1800     # Alpine APK 패키지 (30분)
    cargo: 3600   # Rust Cargo 크레이트 (1시간)
    go: 1800      # Go 모듈 (30분)
    helm: 3600    # Helm 차트 (1시간)
  
  # 패키지 패턴별 TTL 오버라이드
  pattern_ttls:
    "*-SNAPSHOT": 300    # Maven SNAPSHOT 버전 (5분)
    "*-dev": 600         # 개발 버전 (10분)
    "*-alpha": 900       # 알파 버전 (15분)
    "*-beta": 1200       # 베타 버전 (20분)
    "*-rc": 1800         # Release Candidate (30분)
    "test-*": 300        # 테스트 패키지 (5분)
    "*debug*": 450       # 디버그 빌드 (7.5분)
    "*experimental*": 180 # 실험적 버전 (3분)
  
  # 메타데이터 파일별 TTL 설정
  metadata_ttls:
    "repomd.xml": 300      # YUM 메타데이터 (5분)
    "Packages.gz": 600     # APT 패키지 목록 (10분)
    "package.json": 300    # NPM 패키지 정보 (5분)
    "index.yaml": 900      # Helm 인덱스 (15분)
    "Release": 900         # APT Release 파일 (15분)
    "InRelease": 900       # APT InRelease 파일 (15분)
    "maven-metadata.xml": 600  # Maven 메타데이터 (10분)
    "APKINDEX.tar.gz": 450     # Alpine 패키지 인덱스 (7.5분)

#if storage_dir set? proxy, mirror relative
#storage_dir: ~/tmp/proxynd
#proxy_root: ~/tmp/proxy
#mirror_root: ~/tmp/mirror
