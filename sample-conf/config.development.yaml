# ProxyND 개발 환경 설정
# 이 파일은 개발 환경에서 사용되는 설정을 오버라이드합니다.
# 기본 설정(config.yaml)에 추가로 적용됩니다.

# 서버 설정
server:
  port: 8080                       # 개발 환경 포트
  
# 캐시 설정
cache:
  backend: file
  ttl: 300s                        # 개발 환경에서는 짧은 TTL (5분)
  max_size: 1GB                    # 개발 환경에서는 작은 캐시
  
  file:
    directory: ./dev-cache         # 개발 환경 캐시 디렉토리

# 보안 설정
security:
  authentication:
    basic_auth:
      enabled: false               # 개발 환경에서는 인증 비활성화
  
  access_control:
    ip_whitelist:
      enabled: false               # 개발 환경에서는 IP 제한 없음

# 로깅 설정
logging:
  level: debug                     # 개발 환경에서는 디버그 로그
  format: text                     # 개발 환경에서는 읽기 쉬운 텍스트 형식
  
  file:
    path: ./logs/dev-proxynd.log
  
  access_log:
    enabled: true
    path: ./logs/dev-access.log

# 메트릭 설정
metrics:
  enabled: true
  port: 9090                       # 개발 환경에서는 별도 포트 사용

# 고급 설정
advanced:
  performance:
    max_connections: 100           # 개발 환경에서는 낮은 연결 수
    max_idle_connections: 10
  
  retry:
    max_attempts: 1                # 개발 환경에서는 재시도 최소화
  
  circuit_breaker:
    enabled: false                 # 개발 환경에서는 회로 차단기 비활성화