# ProxyND 프로덕션 환경 설정
# 이 파일은 프로덕션 환경에서 사용되는 설정을 오버라이드합니다.
# 기본 설정(config.yaml)에 추가로 적용됩니다.

# 서버 설정
server:
  port: 80                         # 프로덕션 환경 포트
  read_timeout: 60s                # 프로덕션에서는 더 긴 타임아웃
  write_timeout: 60s
  
  # TLS 설정 (HTTPS 활성화)
  tls:
    enabled: true
    cert_file: /etc/proxynd/certs/server.crt
    key_file: /etc/proxynd/certs/server.key
    min_version: TLS1.2

# 캐시 설정
cache:
  backend: redis                   # 프로덕션에서는 Redis 사용
  ttl: 86400s                      # 프로덕션에서는 긴 TTL (24시간)
  max_size: 100GB                  # 프로덕션에서는 큰 캐시
  
  redis:
    address: redis-cluster.internal:6379
    password: ${REDIS_PASSWORD}
    db: 0
    key_prefix: "proxynd:prod:"

# 보안 설정
security:
  authentication:
    basic_auth:
      enabled: true                # 프로덕션에서는 인증 활성화
      users_file: /etc/proxynd/users.yml
  
  access_control:
    ip_whitelist:
      enabled: true                # 프로덕션에서는 IP 제한
      cidrs:
        - 10.0.0.0/8              # 내부 네트워크만 허용
        - 172.16.0.0/12
  
  package_filter:
    enabled: true                  # 프로덕션에서는 패키지 필터 활성화
    mode: allowlist
  
  hash_verification:
    enabled: true                  # 프로덕션에서는 해시 검증 필수
    fail_on_mismatch: true

# 알림 설정
alerts:
  enabled: true
  
  channels:
    - name: webhook
      type: webhook
      enabled: true
      config:
        url: ${SLACK_WEBHOOK_URL}  # Slack 알림
        method: POST

# 로깅 설정
logging:
  level: warn                      # 프로덕션에서는 경고 이상만 로그
  format: json                     # 프로덕션에서는 구조화된 로그
  output: file
  
  file:
    path: /var/log/proxynd/proxynd.log
    max_size: 1GB
    max_backups: 30
    max_age: 90                    # 90일 보관
    compress: true
  
  access_log:
    enabled: true
    path: /var/log/proxynd/access.log
    rotate_daily: true

# 메트릭 설정
metrics:
  enabled: true
  path: /metrics
  port: 9090                       # 별도 포트로 메트릭 노출
  basic_auth: true                 # 메트릭 엔드포인트 인증

# 고급 설정
advanced:
  performance:
    max_connections: 10000         # 프로덕션에서는 높은 연결 수
    max_idle_connections: 1000
    connection_timeout: 60s
    keep_alive: 300s
    buffer_size: 8192
  
  retry:
    max_attempts: 5                # 프로덕션에서는 더 많은 재시도
    initial_delay: 2s
    max_delay: 60s
    multiplier: 2.0
  
  circuit_breaker:
    enabled: true                  # 프로덕션에서는 회로 차단기 활성화
    failure_threshold: 10
    success_threshold: 5
    timeout: 300s