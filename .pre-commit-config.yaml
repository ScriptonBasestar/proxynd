# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

# Configuration
default_language_version:
  golang: 1.22.0

# Only run on commit (not push)
default_stages: [commit]

# Don't stop on first failure
fail_fast: false

repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Remove trailing whitespace
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

      # Ensure files end with a newline
      - id: end-of-file-fixer
        exclude: ^(vendor/|testdata/)

      # Check yaml files
      - id: check-yaml
        args: [--allow-multiple-documents]
        exclude: ^(helm/|k8s/)

      # Prevent large files from being committed
      - id: check-added-large-files
        args: ['--maxkb=1000']

      # Check for merge conflicts
      - id: check-merge-conflict

      # Check json files
      - id: check-json
        exclude: ^(vendor/|testdata/)

      # Detect private keys
      - id: detect-private-key

      # Ensure consistent line endings
      - id: mixed-line-ending
        args: [--fix=lf]

  # Go specific hooks
  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      # Format Go code
      - id: go-fmt

      # Organize imports
      - id: go-imports
        args: [-w, -local, proxynd]

      # Run go vet
      - id: go-vet

      # Ensure go.mod is tidy
      - id: go-mod-tidy

      # Run short tests
      - id: go-unit-tests
        args: [-short]

  # Go linting (using our configured golangci-lint)
  - repo: local
    hooks:
      - id: golangci-lint
        name: golangci-lint
        entry: golangci-lint run --fix --new-from-rev=HEAD~
        language: system
        types: [go]
        pass_filenames: false

  # Local custom checks
  - repo: local
    hooks:
      # Check for go.mod replace directives (should not be in production)
      - id: go-no-replacement
        name: Check for go.mod replacements
        entry: bash -c '! grep -q "^replace" go.mod || (echo "go.mod contains replace directives" && exit 1)'
        language: system
        files: go.mod

      # Ensure generated files are committed
      - id: go-generate
        name: Check go generate
        entry: bash -c 'go generate ./... && git diff --exit-code'
        language: system
        files: \.go$
        pass_filenames: false

      # Check for problematic patterns
      - id: check-fmt-print
        name: Check for fmt.Print statements
        entry: bash -c '! grep -rn "fmt\.Print" --include="*.go" . | grep -v "_test\.go" | grep -v "vendor/" || (echo "Found fmt.Print statements (use structured logging instead)" && exit 1)'
        language: system
        pass_filenames: false

      # Check TODO format
      - id: todo-format
        name: Check TODO format
        entry: bash -c '! grep -rEn "TODO|FIXME" --include="*.go" . | grep -v "vendor/" | grep -v "// TODO(" || (echo "TODOs must include issue reference like TODO(#123)" && exit 1)'
        language: system
        pass_filenames: false
