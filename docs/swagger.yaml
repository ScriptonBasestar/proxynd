basePath: /
definitions:
  enterprise.RoleRequest:
    properties:
      description:
        maxLength: 500
        type: string
      name:
        maxLength: 50
        minLength: 3
        type: string
      permissions:
        items:
          type: string
        minItems: 1
        type: array
    required:
    - name
    - permissions
    type: object
host: localhost:8080
info:
  contact:
    email: support@proxynd.io
    name: ProxyND Support
    url: https://github.com/ScriptonBasestar/proxynd/issues
  description: |-
    High-performance package manager proxy/mirror server supporting Maven, NPM, APT, Docker Registry, PyPI, YUM, and APK

    ProxyND provides caching, authentication, and enterprise features for package management.
    Enterprise features include RBAC, audit logging, analytics, security scanning, and alerting.
  license:
    name: AGPL-3.0
    url: https://www.gnu.org/licenses/agpl-3.0.html
  title: ProxyND API
  version: "1.0"
paths:
  /api/v1/enterprise/alerts:
    get:
      consumes:
      - application/json
      description: Get a paginated list of alerts with optional status and severity
        filtering
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Items per page
        in: query
        name: per_page
        type: integer
      - description: Filter by status (active, acknowledged, resolved)
        in: query
        name: status
        type: string
      - description: Filter by severity (critical, warning, info)
        in: query
        name: severity
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Paginated list of alerts
          schema:
            additionalProperties: true
            type: object
        "402":
          description: Enterprise license required
          schema:
            additionalProperties: true
            type: object
      summary: List active alerts
      tags:
      - Alerts
  /api/v1/enterprise/alerts/{id}:
    get:
      consumes:
      - application/json
      description: Get detailed information about a specific alert
      parameters:
      - description: Alert ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Alert details
          schema:
            additionalProperties: true
            type: object
        "402":
          description: Enterprise license required
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Alert not found
          schema:
            additionalProperties: true
            type: object
      summary: Get alert details
      tags:
      - Alerts
  /api/v1/enterprise/alerts/rules:
    post:
      consumes:
      - application/json
      description: Create a new alert notification rule
      parameters:
      - description: Alert rule
        in: body
        name: rule
        required: true
        schema:
          properties:
            actions:
              type: array
            condition:
              type: object
            name:
              type: string
            type:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created alert rule
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "402":
          description: Enterprise license required
          schema:
            additionalProperties: true
            type: object
      summary: Create alert rule
      tags:
      - Alerts
  /api/v1/enterprise/alerts/rules/{id}:
    delete:
      consumes:
      - application/json
      description: Delete an alert notification rule
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Deletion confirmation
          schema:
            additionalProperties: true
            type: object
        "402":
          description: Enterprise license required
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Rule not found
          schema:
            additionalProperties: true
            type: object
      summary: Delete alert rule
      tags:
      - Alerts
    put:
      consumes:
      - application/json
      description: Update an existing alert rule
      parameters:
      - description: Rule ID
        in: path
        name: id
        required: true
        type: string
      - description: Rule updates
        in: body
        name: rule
        required: true
        schema:
          properties:
            actions:
              type: array
            condition:
              type: object
            enabled:
              type: boolean
            name:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: Updated alert rule
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Invalid request
          schema:
            additionalProperties: true
            type: object
        "402":
          description: Enterprise license required
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Rule not found
          schema:
            additionalProperties: true
            type: object
      summary: Update alert rule
      tags:
      - Alerts
