# ProxyND 개발 환경 설정 파일
# 개발 및 테스트에 최적화된 설정

# 서버 설정
server:
  port: 8080
  host: "0.0.0.0"
  readTimeout: 60s    # 디버깅을 위해 길게 설정
  writeTimeout: 60s
  idleTimeout: 120s

# 상세 로깅 설정
logging:
  level: debug        # 상세 로그
  format: console     # 사람이 읽기 쉬운 형태
  output: stdout
  
  defaultFields:
    service: "proxynd"
    environment: "development"

# 메모리 캐시 (빠른 개발용)
cache:
  type: memory
  ttl: 1800           # 30분 (짧게 설정)
  maxSize: 1073741824 # 1GB
  
  memory:
    maxEntries: 5000
    evictionPolicy: "lru"

# 인증 비활성화 (개발 편의성)
auth:
  enabled: false

# IP 필터 비활성화
ipFilter:
  enabled: false

# NPM 프록시 (모든 패키지 허용)
npm:
  enabled: true
  upstream: "https://registry.npmjs.org"
  useCache: true
  allowedPackages: ["*"]
  
  # 개발용 빠른 응답
  upstreamConfig:
    timeout: 10s
    retries: 1

# PyPI 프록시
pip:
  enabled: true
  upstream: "https://pypi.org/simple"
  useCache: true
  allowedPackages: ["*"]

# APT 프록시 (제한된 배포판)
apt:
  enabled: true
  useCache: true
  
  distributions:
    - name: ubuntu
      upstream: "http://archive.ubuntu.com/ubuntu"
      releases: ["jammy"]  # 최신 LTS만
      components: ["main", "universe"]
      architectures: ["amd64"]

# Docker 프록시
docker:
  enabled: true
  upstream: "https://registry-1.docker.io"
  useCache: true
  allowedImages: ["*"]

# 패키지 검증 (개발용으로 관대하게)
verification:
  enabled: true
  hashVerification:
    enabled: true
    algorithms: ["sha256"]
  
  sizeVerification:
    enabled: false  # 개발시 비활성화
  
  onFailure:
    action: "warn"  # 차단하지 않고 경고만
    notify: false

# 알림 비활성화
alerts:
  enabled: false

# 메트릭 (인증 없음)
metrics:
  enabled: true
  path: "/metrics"
  auth:
    enabled: false
  
  labels:
    instance: "proxynd-dev"
    environment: "development"

# 헬스체크 (간소화)
health:
  enabled: true
  path: "/healthz"
  
  checks:
    diskUsage:
      enabled: false  # 개발시 디스크 체크 비활성화
    
    memoryUsage:
      enabled: false  # 메모리 체크 비활성화
    
    upstream:
      enabled: true
      timeout: 5s

# 성능 설정 (개발용)
performance:
  workers: 1  # 단일 워커
  
  connectionPool:
    maxIdleConns: 10
    maxIdleConnsPerHost: 2
    idleConnTimeout: 30s
  
  compression:
    enabled: false  # 디버깅 편의성을 위해 비활성화

# 디버그 설정
debug:
  enabled: true
  
  # 프로파일링 활성화
  pprof:
    enabled: true
    address: "localhost:6060"
  
  # 요청 덤프
  requestDump:
    enabled: true
    path: "/tmp/proxynd-dumps"
  
  verbose: true