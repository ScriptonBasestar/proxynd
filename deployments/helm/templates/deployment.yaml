apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proxynd.fullname" . }}
  labels:
    {{- include "proxynd.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "proxynd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "proxynd.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "proxynd.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "proxynd.fullname" . }}-vals
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: "proxynd-configmap-volume-mount-files"
              mountPath: /config/global.yaml
              subPath: global.yaml
            - name: "proxynd-configmap-volume-mount-files"
              mountPath: /config/apt-proxy.yaml
              subPath: apt-proxy.yaml
            - name: "proxynd-configmap-volume-mount-files"
              mountPath: /config/maven-proxy.yaml
              subPath: maven-proxy.yaml
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: "proxynd-configmap-volume-mount-files"
          configMap:
            name: {{ include "proxynd.fullname" . }}-files
            items:
              - key: proxynd_global.yaml
                path: global.yaml
              - key: proxynd_apt-proxy.yaml
                path: apt-proxy.yaml
              - key: proxynd_maven-proxy.yaml
                path: maven-proxy.yaml
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
