# Default values for proxynd.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

## @section Global parameters
## Global Docker image parameters
## Please, note that this will override the image parameters, including dependencies, configured to use the global value
##
global:
  ## @param global.imageRegistry Global Docker image registry
  ##
  imageRegistry: ""
  ## @param global.imagePullSecrets Global Docker registry secret names as an array
  ##
  imagePullSecrets: []
  ## @param global.storageClass Global StorageClass for Persistent Volume(s)
  ##
  storageClass: ""

## @section Common parameters
##

## @param replicaCount Number of ProxyND replicas to deploy
##
replicaCount: 1

## @param image.registry ProxyND image registry
## @param image.repository ProxyND image repository
## @param image.tag ProxyND image tag (immutable tags are recommended)
## @param image.pullPolicy ProxyND image pull policy
## @param image.pullSecrets ProxyND image pull secrets
##
image:
  registry: docker.io
  repository: scriptonbasestar/proxynd
  tag: latest
  pullPolicy: IfNotPresent
  ## Optionally specify an array of imagePullSecrets.
  ## Secrets must be manually created in the namespace.
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ##
  pullSecrets: []

## @param nameOverride String to partially override common.names.fullname
##
nameOverride: ""
## @param fullnameOverride String to fully override common.names.fullname
##
fullnameOverride: ""

## @section ProxyND Configuration parameters
##

## ProxyND configuration
## @param proxynd.serverPort Server port
## @param proxynd.configDir Configuration directory mount path
## @param proxynd.storageDir Storage directory mount path
##
proxynd:
  serverPort: 8080
  configDir: "/config"
  storageDir: "/storage"

  ## @param proxynd.logLevel Log level (debug, info, warn, error)
  ##
  logLevel: info

  ## @param proxynd.logFormat Log format (json, text, console)
  ##
  logFormat: json

  ## @param proxynd.environment Environment name
  ##
  environment: production

  ## @param proxynd.existingConfigmap Name of existing ConfigMap with ProxyND configuration
  ##
  existingConfigmap: ""

  ## @param proxynd.existingSecret Name of existing Secret with sensitive configuration
  ##
  existingSecret: ""

  ## ProxyND cache configuration
  ## @param proxynd.cache.type Cache type (filesystem, s3)
  ## @param proxynd.cache.ttl Default cache TTL in seconds
  ## @param proxynd.cache.maxSize Maximum cache size (e.g., "10Gi")
  ##
  cache:
    type: filesystem
    ttl: 3600
    maxSize: "10Gi"

    ## S3 cache configuration (if cache.type is s3)
    ## @param proxynd.cache.s3.bucket S3 bucket name
    ## @param proxynd.cache.s3.region S3 region
    ## @param proxynd.cache.s3.endpoint S3 endpoint (for S3-compatible storage)
    ##
    s3:
      bucket: ""
      region: ""
      endpoint: ""

  ## ProxyND authentication configuration
  ## @param proxynd.auth.enabled Enable authentication
  ## @param proxynd.auth.type Authentication type (basic, token)
  ##
  auth:
    enabled: false
    type: basic

    ## Basic auth users (if auth.type is basic)
    ## @param proxynd.auth.basicAuth.users Basic auth users
    ##
    basicAuth:
      users: []
      # - username: admin
      #   password: changeme
      #   permissions: ["read", "write", "delete"]

  ## ProxyND proxy configurations
  ## @param proxynd.proxies.npm.enabled Enable NPM proxy
  ## @param proxynd.proxies.npm.upstream Upstream NPM registry
  ##
  proxies:
    npm:
      enabled: true
      upstream: https://registry.npmjs.org

    ## @param proxynd.proxies.pip.enabled Enable PyPI proxy
    ## @param proxynd.proxies.pip.upstream Upstream PyPI registry
    ##
    pip:
      enabled: true
      upstream: https://pypi.org/simple

    ## @param proxynd.proxies.apt.enabled Enable APT proxy
    ## @param proxynd.proxies.apt.distributions APT distributions to proxy
    ##
    apt:
      enabled: true
      distributions:
        - name: ubuntu
          upstream: http://archive.ubuntu.com/ubuntu
          architectures: ["amd64", "arm64"]

    ## @param proxynd.proxies.docker.enabled Enable Docker registry proxy
    ## @param proxynd.proxies.docker.upstream Upstream Docker registry
    ##
    docker:
      enabled: true
      upstream: https://registry-1.docker.io

## @section Service parameters
##

## ProxyND service parameters
## @param service.type ProxyND service type
## @param service.port ProxyND service HTTP port
## @param service.nodePort Node port for NodePort service type
## @param service.clusterIP ProxyND service Cluster IP
## @param service.loadBalancerIP ProxyND service Load Balancer IP
## @param service.loadBalancerSourceRanges ProxyND service Load Balancer source ranges
## @param service.externalTrafficPolicy ProxyND service external traffic policy
## @param service.annotations Additional custom annotations for ProxyND service
##
service:
  type: ClusterIP
  port: 8080
  nodePort: ""
  clusterIP: ""
  loadBalancerIP: ""
  loadBalancerSourceRanges: []
  externalTrafficPolicy: Cluster
  annotations: {}

## @section Ingress parameters
##

## Configure the ingress resource that allows you to access the ProxyND
## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
##
ingress:
  ## @param ingress.enabled Enable ingress record generation for ProxyND
  ##
  enabled: false
  ## @param ingress.className IngressClass that will be be used to implement the Ingress (Kubernetes 1.18+)
  ##
  className: ""
  ## @param ingress.annotations Additional annotations for the Ingress resource
  ##
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  ## @param ingress.hosts An array with hostname(s) to be covered with the ingress record
  ##
  hosts:
    - host: proxynd.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  ## @param ingress.tls TLS configuration for additional hostname(s) to be covered with this ingress record
  ##
  tls: []
  #  - secretName: proxynd-tls
  #    hosts:
  #      - proxynd.local

## @section Persistence parameters
##

## Enable persistence using Persistent Volume Claims
## ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
##
persistence:
  ## @param persistence.enabled Enable ProxyND data persistence using PVC
  ##
  enabled: true
  ## @param persistence.storageClass Persistent Volume storage class
  ##
  storageClass: ""
  ## @param persistence.accessModes Persistent Volume access modes
  ##
  accessModes:
    - ReadWriteOnce
  ## @param persistence.size Persistent Volume size
  ##
  size: 10Gi
  ## @param persistence.dataSource Custom PVC data source
  ##
  dataSource: {}
  ## @param persistence.existingClaim The name of an existing PVC to use for persistence
  ##
  existingClaim: ""
  ## @param persistence.annotations Persistent Volume Claim annotations
  ##
  annotations: {}

## @section Pod configuration parameters
##

## @param podAnnotations Annotations for ProxyND pods
##
podAnnotations: {}

## @param podLabels Extra labels for ProxyND pods
##
podLabels: {}

## @param podSecurityContext Set ProxyND pod's Security Context
##
podSecurityContext:
  enabled: true
  fsGroup: 65534
  runAsUser: 65534
  runAsNonRoot: true

## @param containerSecurityContext Set ProxyND container's Security Context
##
containerSecurityContext:
  enabled: true
  runAsUser: 65534
  runAsNonRoot: true
  readOnlyRootFilesystem: false
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

## Configure extra options for ProxyND containers' liveness, readiness and startup probes
## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/#configure-probes
##
livenessProbe:
  enabled: true
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

readinessProbe:
  enabled: true
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6
  successThreshold: 1

startupProbe:
  enabled: false
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 15
  successThreshold: 1

## @param resources Set container requests and limits for different resources like CPU or memory
##
resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

## @param nodeSelector Node labels for pod assignment
##
nodeSelector: {}

## @param tolerations Tolerations for pod assignment
##
tolerations: []

## @param affinity Affinity for pod assignment
##
affinity: {}

## @param priorityClassName ProxyND pods' priorityClassName
##
priorityClassName: ""

## @param schedulerName Name of the k8s scheduler (other than default)
##
schedulerName: ""

## @param topologySpreadConstraints Topology Spread Constraints for pod assignment
##
topologySpreadConstraints: []

## @section ServiceAccount parameters
##

## ServiceAccount configuration
##
serviceAccount:
  ## @param serviceAccount.create Specifies whether a ServiceAccount should be created
  ##
  create: true
  ## @param serviceAccount.name The name of the ServiceAccount to use.
  ##
  name: ""
  ## @param serviceAccount.annotations Additional custom annotations for the ServiceAccount
  ##
  annotations: {}
  ## @param serviceAccount.automountServiceAccountToken Automount service account token for the ProxyND service account
  ##
  automountServiceAccountToken: true

## @section RBAC parameters
##

## RBAC configuration
##
rbac:
  ## @param rbac.create Specifies whether RBAC resources should be created
  ##
  create: false
  ## @param rbac.rules Custom RBAC rules to set
  ##
  rules: []

## @section Metrics parameters
##

## Prometheus metrics
##
metrics:
  ## @param metrics.enabled Enable the export of Prometheus metrics
  ##
  enabled: false
  ## Prometheus Service Monitor
  ## ref: https://github.com/coreos/prometheus-operator
  ##
  serviceMonitor:
    ## @param metrics.serviceMonitor.enabled if `true`, creates a Prometheus Operator ServiceMonitor (also requires `metrics.enabled` to be `true`)
    ##
    enabled: false
    ## @param metrics.serviceMonitor.namespace Namespace in which Prometheus is running
    ##
    namespace: ""
    ## @param metrics.serviceMonitor.interval Interval at which metrics should be scraped.
    ##
    interval: ""
    ## @param metrics.serviceMonitor.scrapeTimeout Timeout after which the scrape is ended
    ##
    scrapeTimeout: ""
    ## @param metrics.serviceMonitor.labels Additional labels that can be used so ServiceMonitor will be discovered by Prometheus
    ##
    labels: {}
    ## @param metrics.serviceMonitor.selector Prometheus instance selector labels
    ##
    selector: {}
    ## @param metrics.serviceMonitor.relabelings RelabelConfigs to apply to samples before scraping
    ##
    relabelings: []
    ## @param metrics.serviceMonitor.metricRelabelings MetricRelabelConfigs to apply to samples before ingestion
    ##
    metricRelabelings: []
    ## @param metrics.serviceMonitor.honorLabels Specify honorLabels parameter to add the scrape endpoint
    ##
    honorLabels: false
    ## @param metrics.serviceMonitor.jobLabel The name of the label on the target service to use as the job name in prometheus.
    ##
    jobLabel: ""

## @section NetworkPolicy parameters
##

## Network Policy configuration
## ref: https://kubernetes.io/docs/concepts/services-networking/network-policies/
##
networkPolicy:
  ## @param networkPolicy.enabled Specifies whether a NetworkPolicy should be created
  ##
  enabled: false
  ## @param networkPolicy.allowExternal Don't require client label for connections
  ##
  allowExternal: true
  ## @param networkPolicy.ingressRules Custom ingress rules
  ##
  ingressRules: []
  ## @param networkPolicy.egressRules Custom egress rules
  ##
  egressRules: []
