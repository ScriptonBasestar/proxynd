# ProxyND Webhook Configuration
# Configure webhook notifications for various system events

# Global webhook settings
enabled: true

# Webhook endpoints
endpoints:
  # Slack webhook example
  - name: "slack-alerts"
    url: "https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK"
    enabled: true
    method: "POST"
    timeout: "30s"
    format: "slack"  # Formats: slack, discord, teams, json

    # HTTP headers
    headers:
      Content-Type: "application/json"
      User-Agent: "ProxyND-Webhook/1.0"

    # Event types to subscribe (empty array = all events)
    # See alerts/webhook_events.go for full list
    event_types:
      - "auth.failure"          # Authentication failures
      - "auth.blocked"          # Blocked authentication attempts
      - "cache.error"           # Cache operation errors
      - "cache.corruption"      # Cache corruption detected
      - "policy.violation"      # Policy violations
      - "policy.quota_exceeded" # Quota exceeded
      - "security.*"            # All security events
      - "server.*"              # All server events

    # Authentication (Slack uses webhook URL token)
    credentials:
      type: "none"

    # Event filtering
    filters:
      min_level: "WARNING"      # Only send WARNING and above
      exclude_types:
        - "cache.miss"          # Exclude cache misses (too frequent)
      package_types:            # Only for these package types
        - "npm"
        - "pip"
        - "apt"
        - "maven"

  # Discord webhook example
  - name: "discord-security"
    url: "https://discord.com/api/webhooks/YOUR/DISCORD/WEBHOOK"
    enabled: false
    method: "POST"
    timeout: "30s"
    format: "discord"

    # Security events only
    event_types:
      - "security.*"
      - "auth.failure"
      - "auth.blocked"
      - "policy.violation"
      - "package.verify_failed"

    credentials:
      type: "none"

    filters:
      min_level: "ERROR"

  # Microsoft Teams webhook example
  - name: "teams-operations"
    url: "https://outlook.office.com/webhook/YOUR-TEAMS-WEBHOOK"
    enabled: false
    method: "POST"
    timeout: "30s"
    format: "teams"

    # Operations events
    event_types:
      - "server.*"
      - "cache.full"
      - "storage.low_space"
      - "upstream.connection_failed"

    credentials:
      type: "none"

    filters:
      min_level: "INFO"

  # Custom JSON webhook with authentication
  - name: "monitoring-system"
    url: "https://monitoring.example.com/webhooks/proxynd"
    enabled: false
    method: "POST"
    timeout: "45s"
    format: "json"

    # All events
    event_types: ["*"]

    # Bearer token authentication
    credentials:
      type: "bearer"
      token: "your-bearer-token-here"

    # Custom headers
    headers:
      X-Source: "proxynd"
      X-Environment: "production"
      X-Version: "1.0.0"

    filters:
      min_level: "INFO"

  # Webhook with HMAC signature
  - name: "secure-endpoint"
    url: "https://secure.example.com/webhook"
    enabled: false
    method: "POST"
    timeout: "30s"
    format: "json"

    event_types: ["*"]

    # HMAC signature authentication
    credentials:
      type: "hmac"
      secret: "your-hmac-secret-key"
      algorithm: "sha256"  # sha1, sha256, sha512
      header: "X-Hub-Signature-256"

    filters:
      min_level: "WARNING"

# Rate limiting configuration
rate_limit:
  enabled: true
  max_per_second: 10        # Max 10 requests per second
  max_per_minute: 100       # Max 100 requests per minute
  max_per_hour: 1000        # Max 1000 requests per hour
  burst_size: 20            # Allow burst up to 20
  window_duration: "1m"     # Sliding window duration
  backoff_strategy: "exponential"  # exponential, linear, constant
  max_backoff_delay: "5m"   # Maximum backoff delay

# Retry configuration
retry:
  enabled: true
  max_attempts: 3           # Maximum retry attempts
  initial_delay: "1s"       # Initial retry delay
  max_delay: "30s"          # Maximum retry delay
  backoff_factor: 2.0       # Exponential backoff multiplier

  # HTTP status codes that trigger retry
  retryable_status:
    - 408  # Request Timeout
    - 429  # Too Many Requests
    - 500  # Internal Server Error
    - 502  # Bad Gateway
    - 503  # Service Unavailable
    - 504  # Gateway Timeout

  # Persist failed events for later retry
  persist_failures: true
  failure_storage_path: "/var/lib/proxynd/webhook-failures"

# Event filtering and processing
event_processing:
  # Default notification level
  default_level: "INFO"

  # Event type specific level overrides
  level_overrides:
    "cache.miss": "DEBUG"           # Cache misses are DEBUG level
    "auth.failure": "WARNING"       # Auth failures are WARNING
    "security.*": "ERROR"           # Security events are ERROR
    "server.stopped": "CRITICAL"    # Server stop is CRITICAL

  # Event aggregation (reduce notification spam)
  aggregation:
    enabled: true
    window_size: "5m"        # Aggregate over 5 minute windows
    max_events: 100          # Max 100 events per window

    # Aggregation strategies by event type
    strategies:
      "cache.*": "count"     # Count cache events
      "auth.*": "sample"     # Sample auth events
      "error.*": "merge"     # Merge similar errors

  # Deduplication
  deduplication:
    enabled: true
    window_size: "1m"        # 1 minute dedup window
    max_occurrences: 5       # Allow max 5 duplicates

# Event buffering
buffering:
  enabled: true
  buffer_size: 1000         # Buffer up to 1000 events
  flush_interval: "10s"     # Flush every 10 seconds
  flush_threshold: 100      # Flush when 100 events buffered
  batch_size: 50            # Send in batches of 50

# Security settings
security:
  verify_ssl: true          # Verify SSL certificates
  allow_insecure: false     # Don't allow insecure connections
  max_payload_size: 1048576 # Max payload size (1MB)

  # IP whitelist/blacklist
  ip_whitelist: []          # Empty = allow all
  ip_blacklist: []          # IPs to block

# Monitoring and health checks
monitoring:
  enabled: true

  # Log webhook performance metrics
  log_performance: true
  log_failures: true
  log_success: false        # Don't log successful webhooks

  # Health check webhooks
  health_check:
    enabled: true
    interval: "5m"          # Check every 5 minutes
    timeout: "10s"          # Health check timeout
    failure_threshold: 3    # Mark unhealthy after 3 failures

# Event templates (customize notification format)
templates:
  # Custom message template
  message_template: |
    🚨 ProxyND Alert: {{ .EventType }}
    Level: {{ .Level }}
    Time: {{ .Timestamp }}
    Message: {{ .Message }}
    {{- if .Details }}
    Details:
    {{- range $key, $value := .Details }}
      {{ $key }}: {{ $value }}
    {{- end }}
    {{- end }}

  # Custom title template
  title_template: "ProxyND {{ .Level }}: {{ .EventType }}"

