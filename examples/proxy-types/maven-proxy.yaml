path: proxy/maven
use_cache: true

# 검색 인덱스 설정 (선택사항)
search_index:
  # 서버 시작 시 자동으로 인덱스 빌드 (기본값: false)
  # 권장: CLI 도구 (proxyndctl maven-index build)를 사용하여 수동으로 빌드
  auto_build_on_startup: false
  
  # 인덱스 자동 갱신 주기 (시간 단위, 0이면 자동 갱신 안함, 기본값: 0)
  # 예: 24 = 하루마다, 168 = 일주일마다
  auto_rebuild_interval_hours: 0
  
  # 인덱스 저장 경로 (기본값: STORAGE_DIR/maven-index)
  # storage_path: /custom/path/to/maven-index

# https://docs.gradle.org/current/userguide/declaring_repositories.html

proxies:
  - name: Maven Center
    id: maven-center
    url: https://repo.maven.apache.org/maven2/
    description: "maven centeral"
  - name: jcener
    id: jcenter
    url: https://jcenter.bintray.com
  - name: google
    id: google
    url: https://maven.google.com
  # https://repo.spring.io/webapp/#/home
  - name: spring_release
    id: repo.spring.io-releases
    url: https://repo.spring.io/release
  - name: spring_snapshots
    id: repo.spring.io-snapshots
    url: https://repo.spring.io/snapshot

