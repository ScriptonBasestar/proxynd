# YUM (RPM) Mirror Configuration
# This configuration sets up ProxyND as a YUM repository mirror,
# synchronizing and hosting RPM packages from multiple distributions

path: mirror/yum
use_cache: true

# Mirror configuration for YUM/DNF repositories
mirrors:
  # CentOS repositories
  centos:
    # CentOS 7
    centos7_base:
      name: "CentOS 7 Base Mirror"
      url: http://mirror.centos.org/centos/7/os/x86_64/
      description: "CentOS 7 base repository mirror"
      distribution: "centos"
      version: "7"
      architecture: "x86_64"

    centos7_updates:
      name: "CentOS 7 Updates Mirror"
      url: http://mirror.centos.org/centos/7/updates/x86_64/
      description: "CentOS 7 updates repository mirror"
      distribution: "centos"
      version: "7"
      architecture: "x86_64"

    centos7_extras:
      name: "CentOS 7 Extras Mirror"
      url: http://mirror.centos.org/centos/7/extras/x86_64/
      description: "CentOS 7 extras repository mirror"
      distribution: "centos"
      version: "7"
      architecture: "x86_64"

    # CentOS 8 Stream
    centos8_stream:
      name: "CentOS 8 Stream Mirror"
      url: http://mirror.centos.org/centos/8-stream/
      description: "CentOS 8 Stream repository mirror"
      distribution: "centos"
      version: "8-stream"
      architecture: "x86_64"

  # Rocky Linux repositories
  rocky:
    rocky8_baseos:
      name: "Rocky Linux 8 BaseOS Mirror"
      url: https://download.rockylinux.org/pub/rocky/8/BaseOS/x86_64/os/
      description: "Rocky Linux 8 BaseOS repository"
      distribution: "rocky"
      version: "8"
      architecture: "x86_64"

    rocky8_appstream:
      name: "Rocky Linux 8 AppStream Mirror"
      url: https://download.rockylinux.org/pub/rocky/8/AppStream/x86_64/os/
      description: "Rocky Linux 8 AppStream repository"
      distribution: "rocky"
      version: "8"
      architecture: "x86_64"

    rocky9_baseos:
      name: "Rocky Linux 9 BaseOS Mirror"
      url: https://download.rockylinux.org/pub/rocky/9/BaseOS/x86_64/os/
      description: "Rocky Linux 9 BaseOS repository"
      distribution: "rocky"
      version: "9"
      architecture: "x86_64"

    rocky9_appstream:
      name: "Rocky Linux 9 AppStream Mirror"
      url: https://download.rockylinux.org/pub/rocky/9/AppStream/x86_64/os/
      description: "Rocky Linux 9 AppStream repository"
      distribution: "rocky"
      version: "9"
      architecture: "x86_64"

  # EPEL (Extra Packages for Enterprise Linux)
  epel:
    epel7:
      name: "EPEL 7 Mirror"
      url: https://download.fedoraproject.org/pub/epel/7/x86_64/
      description: "EPEL 7 repository mirror"
      distribution: "epel"
      version: "7"
      architecture: "x86_64"

    epel8:
      name: "EPEL 8 Mirror"
      url: https://download.fedoraproject.org/pub/epel/8/Everything/x86_64/
      description: "EPEL 8 repository mirror"
      distribution: "epel"
      version: "8"
      architecture: "x86_64"

    epel9:
      name: "EPEL 9 Mirror"
      url: https://download.fedoraproject.org/pub/epel/9/Everything/x86_64/
      description: "EPEL 9 repository mirror"
      distribution: "epel"
      version: "9"
      architecture: "x86_64"

  # Regional mirrors for faster access
  regional_mirrors:
    # Asian mirrors
    kakao:
      name: "Kakao CentOS Mirror"
      url: https://mirror.kakao.com/centos/
      region: "asia"

    naver:
      name: "Naver CentOS Mirror"
      url: https://mirror.navercorp.com/centos/
      region: "asia"

# Mirror synchronization settings
sync:
  # Enable automatic synchronization
  enabled: true

  # Synchronization schedule (cron format)
  schedule: "0 4 * * *"  # Daily at 4 AM

  # Sync strategy
  strategy: "rsync"  # Options: rsync, reposync, createrepo

  # Synchronization options
  options:
    # Delete packages removed from upstream
    delete_removed: true

    # Verify GPG signatures during sync
    verify_signatures: true

    # Create metadata after sync
    create_metadata: true

    # Compress metadata
    compress_metadata: true

  # Bandwidth and concurrency limits
  limits:
    # Maximum concurrent sync processes
    max_concurrent_syncs: 3

    # Bandwidth limit per sync
    bandwidth_limit: "100MB/s"

    # Skip packages larger than this size
    max_package_size: "1GB"

    # Timeout for individual package downloads
    download_timeout: "300s"

# Storage configuration for mirrored packages
storage:
  # Storage backend
  backend: "file"  # Options: file, s3, gcs

  # Repository structure
  structure: "standard"  # Standard YUM repo structure

  # Retention policy
  retention:
    # Keep packages for this duration
    max_age: "180d"

    # Maximum storage size
    max_size: "2TB"

    # Cleanup strategy when limits exceeded
    cleanup_strategy: "oldest_first"  # Options: oldest_first, size_based, lru

    # Keep minimum number of versions per package
    min_versions_per_package: 2

  # Compression settings for stored metadata
  compression:
    enabled: true
    algorithms: ["gzip", "bz2", "xz"]  # Multiple compression formats

# GPG signature verification
gpg_verification:
  # Enable GPG signature verification
  enabled: true

  # GPG keyring directory
  keyring_dir: "/etc/pki/rpm-gpg/"

  # Auto-import missing keys
  auto_import_keys: true

  # Fail sync if signature verification fails
  fail_on_invalid: true

  # Known GPG keys for different distributions
  known_keys:
    centos7: "RPM-GPG-KEY-CentOS-7"
    centos8: "RPM-GPG-KEY-centosofficial"
    rocky8: "RPM-GPG-KEY-rockyofficial"
    rocky9: "RPM-GPG-KEY-rockyofficial"
    epel7: "RPM-GPG-KEY-EPEL-7"
    epel8: "RPM-GPG-KEY-EPEL-8"
    epel9: "RPM-GPG-KEY-EPEL-9"

# Repository metadata settings
metadata:
  # Update metadata frequency
  update_frequency: "hourly"  # Options: hourly, daily, weekly

  # Include file lists in metadata
  include_filelists: true

  # Include other metadata
  include_other: true

  # Metadata compression
  compression: ["gz", "bz2", "xz"]

  # Delta RPM support
  deltarpm:
    enabled: false
    max_delta_rpm_size: "100MB"

# Mirror-specific cache settings
cache:
  # Metadata cache TTL
  metadata_ttl: "1h"

  # Package cache TTL
  package_ttl: "7d"

  # Repository index cache TTL
  repodata_ttl: "30m"

# Health monitoring for upstream repositories
health_monitoring:
  enabled: true
  check_interval: "5m"
  timeout: "30s"
  failure_threshold: 3
  recovery_threshold: 2

  # Check repodata availability
  check_repodata: true

  # Check sample packages
  check_packages: true
  sample_packages: ["bash", "glibc", "kernel"]

# Load balancing between mirrors
load_balancing:
  # Strategy for selecting mirror
  strategy: "geolocation"  # Options: round_robin, geolocation, latency_based

  # Fallback behavior
  fallback_enabled: true
  fallback_order: ["primary", "regional", "global"]

# Authentication for private repositories
private_repositories:
  # Red Hat Satellite/Spacewalk
  satellite:
    url: https://satellite.company.com/pulp/repos/
    auth:
      method: CERTIFICATE
      cert_file: "/etc/pki/consumer/cert.pem"
      key_file: "/etc/pki/consumer/key.pem"

  # Nexus Repository Manager
  nexus:
    url: https://nexus.company.com/repository/yum-group/
    auth:
      method: BASIC
      username: "${NEXUS_USERNAME}"
      password: "${NEXUS_PASSWORD}"
