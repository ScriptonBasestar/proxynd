path: proxy/pip
use_cache: true

proxies:
  # Public repositories (no authentication)
  - name: pypi
    url: https://pypi.org
    description: "Python Package Index (PyPI) official"
  - name: douban
    url: https://pypi.doubanio.com
    description: "Douban PyPI mirror (China)"
  - name: aliyun
    url: https://mirrors.aliyun.com/pypi
    description: "Alibaba Cloud PyPI mirror"
  - name: tsinghua
    url: https://pypi.tuna.tsinghua.edu.cn
    description: "Tsinghua University PyPI mirror"

  # Private/authenticated repositories
  - name: company-devpi
    url: https://devpi.company.com/root/pypi
    description: "Company internal DevPI server"
    auth:
      method: BASIC
      username: "${DEVPI_USERNAME}"
      password: "${DEVPI_PASSWORD}"

  - name: aws-codeartifact
    url: https://company-123456789012.d.codeartifact.us-west-2.amazonaws.com/pypi/pypi-repo/
    description: "AWS CodeArtifact Python repository"
    auth:
      method: TOKEN
      token: "${CODEARTIFACT_TOKEN}"

  - name: azure-artifacts-pypi
    url: https://pkgs.dev.azure.com/company/_packaging/feed/pypi/
    description: "Azure DevOps Artifacts Python feed"
    auth:
      method: BASIC
      username: "${AZURE_USERNAME}"
      password: "${AZURE_PAT}"

  - name: nexus-pypi
    url: https://nexus.company.com/repository/pypi-group/
    description: "Nexus PyPI repository group"
    auth:
      method: BASIC
      username: "${NEXUS_USERNAME}"
      password: "${NEXUS_PASSWORD}"

  - name: gemfury
    url: https://pypi.fury.io/company/
    description: "Gemfury private Python repository"
    auth:
      method: TOKEN
      token: "${GEMFURY_TOKEN}"
