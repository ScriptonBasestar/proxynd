path: proxy/docker
use_cache: true

proxies:
  # Public registries (no authentication)
  - name: docker-hub
    url: https://registry-1.docker.io
    description: "Docker Hub public registry"
  - name: gcr-public
    url: https://gcr.io
    description: "Google Container Registry public"
  - name: quay-public
    url: https://quay.io
    description: "Red Hat Quay public registry"

  # Private/authenticated registries
  - name: docker-hub-private
    url: https://registry-1.docker.io
    description: "Docker Hub with authentication for private repos"
    auth:
      method: BASIC
      username: "${DOCKER_USERNAME}"
      password: "${DOCKER_PASSWORD}"

  - name: gcr-private
    url: https://gcr.io
    description: "Google Container Registry with service account"
    auth:
      method: TOKEN
      token: "${GCR_TOKEN}"  # Service account token

  - name: aws-ecr
    url: https://123456789012.dkr.ecr.us-west-2.amazonaws.com
    description: "AWS Elastic Container Registry"
    auth:
      method: AWS_ECR
      region: "us-west-2"
      access_key: "${AWS_ACCESS_KEY_ID}"
      secret_key: "${AWS_SECRET_ACCESS_KEY}"

  - name: company-registry
    url: https://registry.company.com
    description: "Company private Docker registry"
    auth:
      method: CERTIFICATE
      cert_file: "/etc/docker/certs.d/registry.company.com/client.crt"
      key_file: "/etc/docker/certs.d/registry.company.com/client.key"
      ca_file: "/etc/docker/certs.d/registry.company.com/ca.crt"
