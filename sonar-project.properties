# SonarCloud configuration for ProxyND

# Project identification
sonar.projectKey=proxynd
sonar.organization=proxynd
sonar.projectName=ProxyND
sonar.projectVersion=1.0

# Source code configuration
sonar.sources=.
sonar.exclusions=**/*_test.go,**/vendor/**,**/testdata/**,**/*.pb.go,**/mocks/**
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.test.exclusions=**/vendor/**

# Language specific configuration
sonar.go.coverage.reportPaths=coverage.out

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true

# Coverage
sonar.coverage.exclusions=**/main.go,**/cmd/**,**/tests/**,**/mocks/**

# Duplication
sonar.cpd.exclusions=**/*_test.go,**/vendor/**,**/testdata/**

# Issue exclusions
sonar.issue.ignore.multicriteria=e1,e2

# Ignore "TODO" comments
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S1135
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.go

# Ignore missing package comments for test files
sonar.issue.ignore.multicriteria.e2.ruleKey=go:S1186
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*_test.go